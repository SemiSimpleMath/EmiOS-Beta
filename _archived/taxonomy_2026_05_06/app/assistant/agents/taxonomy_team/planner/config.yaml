name: taxonomy_team::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"
  

allowed_tools: [taxonomy_merge_categories, taxonomy_rename_category, taxonomy_move_category, taxonomy_update_description, taxonomy_create_category]
allowed_nodes: [return_control]

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - action_count

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task




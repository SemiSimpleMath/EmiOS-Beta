# Email allowlist — recipients Emi can email autonomously without
# requiring user approval.
#
# When send_email is invoked with `to` matching an address in this
# list (case-insensitive exact match), the standard approval gate is
# softened to chat-surface authority (95). This lets the
# dayflow_orchestrator (authority 95) send to known recipients
# without firing a confirmation ticket each time.
#
# Recipients NOT on this list trigger the normal approval flow —
# only master_room (authority 99) can send unprompted.
#
# Hard rules:
#   - Exact match only. No wildcards, no substring matching.
#   - Add explicitly. Never auto-populated by Emi or any agent.
#   - User-edited only. The chat can suggest additions, but the
#     user has to commit the edit and restart for it to take effect.
#
# Format: flat list of lowercase email strings under `recipients:`.
# Comments above each entry document who the address belongs to so
# future audits can answer "why is this address on the list?"


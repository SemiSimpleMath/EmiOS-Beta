# Model Tiers
# ============================================================================
# A tier is the model each provider runs plus the reasoning effort. It is the
# ONLY place a model is chosen: every agent config names a tier, never a model.
#
#   llm_params:
#     llm_provider: "openai"
#     model_tier: "mini"
#
# Switching models, or effort, for every agent on a tier is one line here.
# `effort` is OpenAI reasoning effort (none | low | medium | high); providers
# without it ignore it. An agent naming a tier not defined here fails boot
# validation.
# ============================================================================

tiers:

  nano:
    description: "Routing and picking from a list: no reasoning"
    effort: "none"
    openai: "gpt-6-luna"
    gemini: "gemini-2.5-flash-lite"
    anthropic: "claude-3-5-haiku-20241022"
    opencode: "kimi-k2.5"

  mini:
    description: "Most agents"
    effort: "low"
    openai: "gpt-6-luna"
    gemini: "gemini-3-flash-preview"
    anthropic: "claude-3-5-haiku-20241022"
    opencode: "kimi-k2.7-code"

  smart:
    description: "Decisions that are written down and believed by everything after them: KG writes and merges, belief merges, dayflow judgments"
    effort: "medium"
    openai: "gpt-6-luna"
    gemini: "gemini-3-flash-preview"
    anthropic: "claude-3-5-haiku-20241022"
    opencode: "glm-5.2"

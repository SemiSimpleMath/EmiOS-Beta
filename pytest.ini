[pytest]
# The repo had no pytest configuration at all, so a bare `pytest` at the root
# recursed into _archived/ and died during collection before running a single
# test. _archived/ is tracked (129 files) and deliberately holds code that was
# retired -- including tests importing modules that were deleted with it, e.g.
# app.assistant.control_nodes.summary_context_node. Those are not failures to
# fix; the tests are archived alongside the code they covered.
norecursedirs = _archived .git .venv node_modules *.egg-info

# Edge importance eval set.
#
# Each entry pairs a real KG edge with the score we think it should get,
# **rated from the SOURCE node's perspective** on a 0-10 scale.
# The lens user's lens-relevance comes later via node × edge in PR.
#
# CRITICAL: rate from the source's POV, not the lens user's.
#   - "Jimmy Carter has_state Deceased" = 9 — defining to Jimmy himself.
#     Lens user (Jukka) won't see Jimmy at top zoom because Jimmy's NODE
#     importance is correctly low.
#   - "Phil son_of Phil's dad" = 9 — defining to Phil.
#     "Jukka knows Phil's dad" = 3 — for Jukka source, just acquaintance.
#
# Calibration anchors:
#   9-10 : defining lifelong bonds + identity-defining states (married, parent_of, child_of, deceased, defining trait)
#   7-8  : significant ongoing (close friend, mentor, in-laws, central trait)
#   5-6  : regular but not defining (colleague, friend, neighbor, personal rule, ownership of treasured pet)
#   3-4  : occasional / acquaintance / minor functional state
#   1-2  : one-off mentions, contact info, taxonomy
#   0    : extraction artifacts

cases:
  # === FAMILY: defining bonds for the source ===
  - id: 8cfac974-02d8-47b9-9da8-32bfdaaa8428
    desc: "Peter --is_child_in--> 'Parent of Peter'"
    expected: 10
    notes: "From Peter: his parents are defining."

  - id: be3ea27a-cc38-49d4-a13b-acc00e391127
    desc: "V.S. Varadarajan --is_advisor_in--> 'Advised by Varadarajan' (advisor of Jukka)"
    expected: 8
    notes: "From Varadarajan: advising students is core professional identity. 8 across all his students."

  - id: b1438a56-ca36-4e2a-a9cc-38a4671743f5
    desc: "V.S. Varadarajan --is_advisor_in--> 'Advised by Varadarajan' (advisor of Rahul)"
    expected: 8
    notes: "From Varadarajan: same — advising any student. Source-symmetric across his advisees."

  - id: 9aca0c7a-5839-487d-a0da-3dac55d1e295
    desc: "Phil --is_friend_in--> 'Friendship' (with Jukka)"
    expected: 7
    notes: "From Phil: close friend strength."

  # === IDENTITY-DEFINING TRAITS (has_state but defining) ===
  - id: 59a33548-f1e9-4f51-bc94-321952e9f133
    desc: "Peter --has_state--> 'Great at mathematics'"
    expected: 8
    notes: "From Peter: math is part of his identity."

  - id: 180637d9-68db-4676-8418-8a44a5bafc19
    desc: "Annika --has_state--> 'Loves music'"
    expected: 7
    notes: "From Annika: defining hobby / passion."

  # === STATE EDGES OF VARYING SOURCE-IMPORTANCE ===
  - id: b0ac15ca-c0b9-4990-974a-b49827e13c84
    desc: "Jimmy --has_state--> 'Deceased' (Jimmy Carter died)"
    expected: 9
    notes: "From Jimmy: dying is THE defining edge. (Lens-user separately gets him filtered low via node importance.)"

  - id: cce11df2-712d-4171-9674-b3e359a57862
    desc: "Katy --has_state--> 'Period Day 1 Boundary'"
    expected: 5
    notes: "From Katy: a personal rule she lives by. Important to her, not life-defining."

  # === FUNCTIONAL CONTACT INFO: low even from source perspective ===
  - id: 7b359202-6b29-4b23-9141-26b548111273
    desc: "Rahul --has_state--> 'Email' (rahul.fernandez@gmail.com)"
    expected: 2
    notes: "From Rahul: having an email is functional, not defining."

  - id: 3a7724a7-dc3d-4e05-9d2d-ba6535bfa761
    desc: "Katy --has_state--> 'has_email_address'"
    expected: 2
    notes: "From Katy: same — functional fact."

  - id: 85dba352-8e0d-4e12-969f-247cd29e91f4
    desc: "'310-963-0721' --is_number_in--> 'Has phone number' (Jukka's)"
    expected: 1
    notes: "Source is a phone number — barely an entity. The edge is its only meaning. Still rate by structural triviality."

  # === OWNERSHIP ===
  - id: 8961bf74-9455-4364-b52f-cb0c18aca6d5
    desc: "Katy --owner--> 'Owns Waldo' (the dog)"
    expected: 7
    notes: "From Katy: a treasured pet she shared. Strong attachment."

  # === TAXONOMY ===
  - id: 9ef2a42f-92ec-46ce-84a8-45d7ff432f7a
    desc: "Waldo --is_a--> 'dog'"
    expected: 1
    notes: "Pure taxonomy. Even from Waldo's POV (anthropomorphizing), being a dog is structural, not relational."

  - id: cd1cbb4f-391f-4abe-86a2-7a1bbbbfda86
    desc: "Waldo --is_a--> 'Labrador Retriever'"
    expected: 1
    notes: "Same — taxonomy."

  # === FRIENDSHIP FROM A THIRD PARTY'S PERSPECTIVE ===
  - id: baf95b0a-4103-4ad8-8645-86977acd1abd
    desc: "Nicole --is_friend_in--> 'Friendship' (with Katy)"
    expected: 8
    notes: "From Nicole: close friend bond with Katy."

  # === EVENT EDGES ===
  - id: f6e4ab53-cc2a-4c73-8466-d6b112950fa1
    desc: "Jukka --host--> 'Visit' (visited by sister and dad)"
    expected: 6
    notes: "From Jukka: meaningful family visit, not life-defining."

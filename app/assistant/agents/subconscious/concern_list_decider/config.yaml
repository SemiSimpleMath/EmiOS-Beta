name: subconscious::concern_list_decider
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  model_tier: "mini"

# The brain's list for one concern (docs/design/brain_delegates_work_2026-10-04.md). SHADOW ONLY: after the live
# concern planner writes a plan, subconscious/concern_list_shadow.py gives this agent the same record and lookups
# the live decider read, with the concern's entries on the brain's list; it keeps, modifies or cancels each entry
# by id and adds what is missing, each naming who acts, the assistant's part and when. Recorded in
# brain_list_entries; nothing is handed to dayflow. Same tier as the live decider, for a fair comparison.
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - agent_input

required_context_items:
  - agent_input

system_context_items:
  - resource_assistant_data
  - resource_user_data
  - resource_orchestrator_user_prefs

name: subconscious::answer_matcher
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.6-luna"
  model_tier: "fast"

# Pure judgment call: question + candidate user messages in, verdict out.
# No tools, no skills — context is fully pre-injected by answer_capture.
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - agent_input

# Prompt guard: matched on blank input undetected until 2026-06-12 —
# refuse loudly instead.
required_context_items:
  - agent_input

system_context_items:
  - resource_assistant_data

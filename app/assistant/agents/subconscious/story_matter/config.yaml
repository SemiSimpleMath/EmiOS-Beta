name: subconscious::story_matter
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  model_tier: "mini"

# Tells the owner, in plain words, what the brain made of one matter: a headline and one line per
# event (what arrived and what became of it). Written once per matter for the owner's /mind page;
# context fully pre-injected by subconscious/brain_stories.py, which checks every event has its line.
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - agent_input

required_context_items:
  - agent_input

system_context_items:
  - resource_assistant_data
  - resource_user_data

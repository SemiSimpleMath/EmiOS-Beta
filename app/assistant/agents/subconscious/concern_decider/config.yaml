# subconscious::concern_decider — the deciding half of concern_planner_manager: from the concern's record
# and what the planner gathered, decides what the concern needs now and writes the things that should be
# done, as bullet points under the concern. Consumers read them and decide how.
name: subconscious::concern_decider
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  model_tier: "mini"

allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false
entity_scan_keys: []
entity_card_level: 0

user_context_items:
  - date_time
  - day_of_week
  - task
  - recent_history

system_context_items:
  - resource_assistant_data
  - resource_user_data

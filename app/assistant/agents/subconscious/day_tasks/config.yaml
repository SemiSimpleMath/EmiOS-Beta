name: subconscious::day_tasks
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  model_tier: "smart"

# The day's tasks (docs/design/brain_delegates_work_2026-10-04.md): for every placement on today's calendar,
# whether today needs the assistant to do something, who acts, the assistant's part and when, read against the
# brain's situation (subconscious/situation.py), and its own entries for what the day needs that no placement asks
# for (2026-10-06). Its answers go on the brain's list; in the calendar lane's live days dayflow makes work from them.
# Context is fully pre-injected; code validates.
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - agent_input

required_context_items:
  - agent_input

system_context_items:
  - resource_assistant_data
  - resource_user_data
  - resource_assistant_capabilities
  - resource_owner_standing_directives

# subconscious::concern_tasks — the deciding half of concern_planner_manager (until 2026-10-05 the concern
# decider, which wrote bullets for the steward to interpret): from the concern's record, its entries on the brain's
# list and what the planner gathered, decides what the concern needs now (act now, hold, no action) and changes the
# concern's entries: new ones, and those modified or cancelled by id; an entry it leaves out stays as it is
# (docs/design/brain_delegates_work_2026-10-04.md, "Two task deciders, one list").
name: subconscious::concern_tasks
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  model_tier: "mini"

allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false
entity_scan_keys: []
entity_card_level: 0

user_context_items:
  - date_time
  - day_of_week
  - task
  - recent_history

system_context_items:
  - resource_assistant_data
  - resource_user_data

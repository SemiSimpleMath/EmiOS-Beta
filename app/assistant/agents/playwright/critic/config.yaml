name: playwright::critic
class_name: PlaywrightCritic
llm_params:
  llm_provider: "openai"
  engine: "gpt-4.1"
  model_tier: "smart"
  temperature: 0

allowed_tools: []
except_tools: []

# Same site-specific guidelines the planner gets — so the critic can flag
# "you should be using the search bar" rather than just rubber-stamping the
# planner's misuse. Keys must match playwright/planner/config.yaml.
task_keyword_resources:
  doordash: resource_doordash_guidelines
  door dash: resource_doordash_guidelines
  cnn.com: resource_cnn_guidelines
  cnn: resource_cnn_guidelines
  bbc.com: resource_bbc_guidelines
  bbc: resource_bbc_guidelines

system_context_items:
  - resource_assistant_data
  - resource_current_location

user_context_items:
  - date_time
  - task
  - critic_payload
  - critic_intended_action_input
  - recent_history
  - pending_tool_name
  - pending_tool_arguments
  - playwright_critic_image


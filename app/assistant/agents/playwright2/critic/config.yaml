name: playwright2::critic
class_name: PlaywrightCritic
llm_params:
  llm_provider: "openai"
  engine: "gpt-4.1"
  model_tier: "smart"
  temperature: 0

allowed_tools: []
except_tools: []

# Same site-specific guidelines the planner gets — so the critic can flag
# "you should be using the search bar" rather than just rubber-stamping the
# planner's misuse. Triggers live on each skill's auto_inject_when block.
accept_auto_skills: true

system_context_items: []

user_context_items:
  - date_time
  - task
  - critic_payload
  - critic_intended_action_input
  - recent_history
  - pending_tool_name
  - pending_tool_arguments
  - playwright_critic_image


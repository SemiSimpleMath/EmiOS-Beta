name: daily_summary::calendar_analyzer
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"
  

allowed_tools:
  - get_calendar_events
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]

user_context_items:
  - date_time
  - recent_history
  - entity_level_0

system_context_items:
  - tool_descriptions




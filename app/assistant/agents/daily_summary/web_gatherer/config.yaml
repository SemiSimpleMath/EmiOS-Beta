name: daily_summary::web_gatherer
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"
  

allowed_tools:
  - search_web
  - scrape_url
except_tools: []

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - web_content


system_context_items:
  - tool_descriptions

append_fields: [web_analysis, relevant_info, news_highlights]















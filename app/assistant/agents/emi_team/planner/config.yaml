name: emi_team::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.1"
  model_tier: "smart"
  

allowed_tools: all
except_tools: [emi_team_manager]
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]
entity_card_level: 0

user_context_items:
  - date_time
  - task
  - information
  - task_includes
  - task_resource_context
  - recent_history
  - checklist
  - progress_report
  - action_count
  - entity_card
  - referenced_pods_block
  - resource_accounts

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task
  - date_time

skills:
  # Delegator-relevant only. emi_team picks the right manager and briefs
  # it — it does NOT compose API calls, write code, drive browsers, or
  # send emails directly. Skills that carry implementation mechanics
  # (bluesky API recipe, github API recipe, image-resize, etc.) MUST NOT
  # land here; they bloat the delegator's prompt with details its
  # downstream sub-managers already own. `accept_auto_skills: false`
  # below enforces that; this static list is the curated set emi_team
  # actually needs to delegate well.
  - critic-handling
  - pod-finder              # picks the right tool when files come up
  - emi-acting-as-herself   # principal mode shapes how it briefs sub-managers
  - emi-values              # her voice / stance affects task framing

# Delegator does NOT accept auto-injected skills. See the comment on
# `skills:` above for why. Anything matching a keyword would just bloat
# the prompt with downstream-manager implementation detail.
accept_auto_skills: false

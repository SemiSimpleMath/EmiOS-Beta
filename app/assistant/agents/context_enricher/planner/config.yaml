name: context_enricher::planner
class_name: Agent
llm_params:
  llm_provider: "gemini"
  engine: "gemini-3-flash-preview"
  model_tier: "mini"
  temperature: 0.3

allowed_tools: []
except_tools: []
allowed_nodes: []
entity_scan_keys: []

user_context_items:
  - task
  - information

# Prompt guard: an enricher with no item or no KG results writes
# fabrication-bait — refuse loudly instead (the prep node already skips
# items with empty KG context, so empties here mean caller bugs).
required_context_items:
  - task
  - information

system_context_items:
  - date_time

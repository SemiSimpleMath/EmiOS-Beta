name: pod_classifier
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "mini"

allowed_tools: []
except_tools: []

# Pass 1: burst-only classification. No chat history, no entity cards.
# Entity resolution is a separate pass (pod_entity_resolver) run only
# when a pod is actually being minted.
user_context_items:
  - burst_content
  - tag_vocabulary

system_context_items: []

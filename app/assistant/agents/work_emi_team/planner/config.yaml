# work_emi_team::planner — emi_team::planner's generalist coordinator (its model, tool ceiling, skills,
# entity-cards) adapted to OWN a WorkObject graph node. Deltas vs app/assistant/agents/emi_team/planner/:
#   class_name: Planner -> WorkPlanner       (mirrors checklist -> subtask nodes + findings -> node results)
#   own AgentForm (id-keyed checklist + findings + info_for_others) — emi_team::planner's List[str]
#                                            checklist can't round-trip through the graph.
#   user_context_items: work_projection (the render node injects YOUR NODE + checklist with [id]s)
#                                            replaces task / information / checklist.
# Prompts (system.j2 / user.j2) derived from emi_team/planner's — it hands whole surfaces to specialist
# managers (does not decompose a single manager's job).
name: work_emi_team::planner
class_name: WorkPlanner
# Uniform WorkPlanner behaviour (same as work_web_manager::planner): its checklist items mint subtask
# nodes; the item it marks in_progress is the ACTIVE node, so the manager it delegates that turn nests
# UNDER that item (goal -> surface item -> delegated child). See WorkPlanner._reconcile_to_graph +
# work_objects.runtime.active_attribution_node.
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.1"
  model_tier: "smart"

allowed_tools: all
except_tools: [work_emi_team_manager]
allowed_nodes: [return_control]
entity_scan_keys: [work_projection, recent_history]
entity_card_level: 0

user_context_items:
  - work_projection      # the render node injects the owned node + checklist (with [id]s) here
  - date_time
  - recent_history
  - action_count
  - entity_card

system_context_items:
  - tool_descriptions
  - allowed_nodes

skills:
  - critic-handling
  - pod-finder
  - emi-acting-as-herself
  - emi-values

accept_auto_skills: false

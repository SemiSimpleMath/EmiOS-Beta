# work_emi_team::planner — emi_team::planner's delegating generalist (its model, tool ceiling, skills,
# entity-cards) adapted to OWN a WorkObject graph node. Deltas vs app/assistant/agents/emi_team/planner/:
#   class_name: Planner -> WorkPlanner       (mirrors checklist -> subtask nodes + findings -> node results)
#   own AgentForm (id-keyed checklist + findings + info_for_others) — emi_team::planner's List[str]
#                                            checklist can't round-trip through the graph.
#   user_context_items: work_projection (the render node injects YOUR NODE + checklist with [id]s)
#                                            replaces task / information / checklist.
# Prompts (system.j2 / user.j2) derived from emi_team/planner's — DELEGATION philosophy, not decompose.
name: work_emi_team::planner
class_name: WorkPlanner
# Delegator: its tracked subtask nodes ARE the handoffs it dispatches (one per surface), so its checklist
# is a PRIVATE plan — NOT mirrored to graph subtasks (that would duplicate each handoff child). See
# WorkPlanner._reconcile_to_graph. (work_web_manager::planner keeps the default true — it does the work
# itself, so its checklist IS its subtask progress.)
mirror_checklist_to_graph: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.1"
  model_tier: "smart"

allowed_tools: all
except_tools: [work_emi_team_manager]
allowed_nodes: [return_control]
entity_scan_keys: [work_projection, recent_history]
entity_card_level: 0

user_context_items:
  - work_projection      # the render node injects the owned node + checklist (with [id]s) here
  - date_time
  - recent_history
  - action_count
  - entity_card

system_context_items:
  - tool_descriptions
  - allowed_nodes

skills:
  - critic-handling
  - pod-finder
  - emi-acting-as-herself
  - emi-values

accept_auto_skills: false

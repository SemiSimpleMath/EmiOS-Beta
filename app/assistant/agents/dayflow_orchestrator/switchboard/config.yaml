name: dayflow_orchestrator::switchboard
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

allowed_tools: all
# Switchboard routes; it doesn't ask the user mid-decision. ask_user is a
# clarification leaf for in-task use by a manager, not a routing primitive.
# See room/switchboard/config.yaml for the same rule + the Slack incident
# that motivated this explicit block.
except_tools:
  - ask_user
allowed_nodes: [return_control]
entity_scan_keys: []

user_context_items:
  - date_time
  - task
  - information

system_context_items:
  - resource_assistant_data
  - resource_user_data
  - tool_descriptions

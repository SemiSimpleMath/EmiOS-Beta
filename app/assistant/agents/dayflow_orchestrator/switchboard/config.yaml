name: dayflow_orchestrator::switchboard
class_name: Agent
llm_params:
  llm_provider: "openai"
  model_tier: "nano"

# The two routes and nothing else (2026-10-04): with `all`, its tool list showed ten tools it may not choose,
# among them personal_admin_manager ("... reminders"), and it sent a "Remind [the owner]" step to the work team.
allowed_tools:
  - create_dayflow_ticket
  - work_emi_team_manager
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: []

user_context_items:
  - date_time
  - task
  - information

system_context_items:
  - resource_assistant_data
  - resource_user_data
  - tool_descriptions

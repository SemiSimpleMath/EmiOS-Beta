name: dayflow_orchestrator::state_mover
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

allowed_tools: []
except_tools: []
allowed_nodes: []
entity_scan_keys: [planner_summary]
entity_card_level: 0

user_context_items:
  - date_time
  - day_of_week
  - ready_work_nodes
  - waiting_work_nodes
  - work_wait_intake
  - resource_expected_calendar
  - resource_dayflow_routine
  - resource_afk_statistics_output
  - recent_dayflow_chat_history
  - recent_responded_tickets
  - location_summary
  - resource_weather
  - health_status_summary
  - entity_card

# The status legend is rendered by system.j2, so it is a SYSTEM item. It sat under
# user_context_items until 2026-09-18, which made the system prompt's `{{ node_status_legend }}`
# render as a blank line — the state_mover had never once seen the legend. The boot validator
# said so at every start.
system_context_items:
  - node_status_legend

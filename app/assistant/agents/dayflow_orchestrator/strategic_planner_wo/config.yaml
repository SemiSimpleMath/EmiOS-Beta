name: strategic_planner_wo
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "mini"

allowed_tools: []
except_tools: []

entity_scan_keys: [admitted_artifacts, work_portfolio]
entity_card_level: 0

user_context_items:
  - date_time
  - day_of_week
  - resource_afk_statistics_output
  - location_summary
  - resource_weather
  - health_status_summary
  - resource_expected_calendar
  - resource_daily_context_generator_output
  - resource_dayflow_routine
  - active_tickets
  - recent_ticket_replies
  - recent_action_selector_actions
  - admitted_artifacts
  - work_portfolio
  - recent_completed_work
  - recent_abandoned_work
  - recent_dispatch_results
  - entity_card

system_context_items:
  - resource_user_data
  - resource_assistant_data
  - resource_orchestrator_user_prefs

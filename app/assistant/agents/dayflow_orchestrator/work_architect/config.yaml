name: work_architect
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "mini"

allowed_tools: []
except_tools: []

# The architect must see ~the same situational picture the steward saw when it minted the goal — the
# calendar, the source intake, the day's state, who the user is, entity cards — or it decomposes blind
# (e.g. shaping "walk the dogs" as an executable step instead of a notify). These resolve from the same
# shared blackboard + resources the steward loaded earlier this tick.
entity_scan_keys: [task, information]
entity_card_level: 0

user_context_items:
  - date_time
  - day_of_week
  - resource_afk_statistics_output
  - location_summary
  - resource_weather
  - health_status_summary
  - resource_expected_calendar
  - resource_daily_context_generator_output
  - resource_dayflow_routine
  - admitted_artifacts
  - entity_card
  - task
  - information

system_context_items:
  - resource_user_data
  - resource_assistant_data

# Log the rendered SYSTEM + USER prompts to the agents log on every architect call.
# The architect is invoked directly via work_architect_node, and its prompts are otherwise
# invisible (suppressed by the prompt_debug gate) - seeing the rendered CONTEXT (ticket
# replies, portfolio) is key to verifying re-plan behaviour.
prompt_debug:
  system: true
  user: true

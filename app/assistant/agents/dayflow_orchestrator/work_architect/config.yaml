name: work_architect
class_name: Agent
llm_params:
  llm_provider: "openai"
  model_tier: "smart"

allowed_tools: []
except_tools: []

# The architect must see ~the same situational picture the goal was decided from — the
# calendar, the source intake, the day's state, who the user is, entity cards — or it decomposes blind
# (e.g. shaping "walk the dogs" as an executable step instead of a notify). These resolve from the same
# shared resources the tick reads.
entity_scan_keys: [task, information]
entity_card_level: 0

user_context_items:
  - date_time
  - day_of_week
  - resource_afk_statistics_output
  - location_summary
  - resource_weather
  - health_status_summary
  # RESOURCE-sourced only. Blackboard-sourced items (expected_schedule_view,
  # recent_abandoned_work, recent_dispatch_results) cannot resolve here: this agent is created
  # with its own blackboard, deliberately, because sharing the tick's made `task` resolve to
  # "Dayflow cadence tick" instead of the goal. Declaring an item the agent cannot reach is
  # worse than omitting it — it reads as available and renders empty. Anything the architect
  # needs from the tick arrives through the Message (see _situational_context).
  - resource_expected_calendar
  - resource_daily_context_generator_output
  - resource_dayflow_routine
  - entity_card
  - task
  - information

# The owner's standing directives, split by role on 2026-10-08 (wrong context is worse than none): the architect
# reads what the assistant can do, how to shape work (goals not methods; notifying apart from acting; the device
# rule) and whether a task is worth doing at all. The directives about what to do on the owner's behalf go to the
# brain's deciders, how to approach a task to the workers, escalation to no one yet. Each system item must be
# rendered by system.j2 (until 2026-09-18 a declared item went unrendered).
system_context_items:
  - resource_user_data
  - resource_assistant_data
  - resource_assistant_capabilities
  - resource_work_shaping
  - resource_worth_doing

# Who releases a notification and when (owner, 2026-10-08): the architect suggests the time, the state mover decides.
skills:
  - notification-release

# Log the rendered SYSTEM + USER prompts and the architect's answer to the agents log on every
# architect call. The architect is invoked directly via work_architect_node, and its prompts are otherwise
# invisible (suppressed by the prompt_debug gate) - seeing the rendered CONTEXT (ticket
# replies, portfolio) is key to verifying re-plan behaviour. The answer (results) was not logged until
# 2026-10-05, when a refused re-plan could be read only from its error, not from what was proposed.
prompt_debug:
  system: true
  user: true
  results: true

name: work_architect
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.6-luna"
  model_tier: "mini"

allowed_tools: []
except_tools: []

# The architect must see ~the same situational picture the steward saw when it minted the goal — the
# calendar, the source intake, the day's state, who the user is, entity cards — or it decomposes blind
# (e.g. shaping "walk the dogs" as an executable step instead of a notify). These resolve from the same
# shared blackboard + resources the steward loaded earlier this tick.
entity_scan_keys: [task, information]
entity_card_level: 0

user_context_items:
  - date_time
  - day_of_week
  - resource_afk_statistics_output
  - location_summary
  - resource_weather
  - health_status_summary
  # RESOURCE-sourced only. Blackboard-sourced items (expected_schedule_view,
  # recent_abandoned_work, recent_dispatch_results) cannot resolve here: this agent is created
  # with its own blackboard, deliberately, because sharing the tick's made `task` resolve to
  # "Dayflow cadence tick" instead of the goal. Declaring an item the agent cannot reach is
  # worse than omitting it — it reads as available and renders empty. Anything the architect
  # needs from the tick arrives through the Message (see _situational_context).
  - resource_expected_calendar
  - resource_daily_context_generator_output
  - resource_dayflow_routine
  - entity_card
  - task
  - information

# The node-authoring doctrine lives here. resource_orchestrator_user_prefs carries the
# notification rule ("If both communication and action are needed, create separate tasks"), the
# device-control rule, and the escalation policy — all of which are instructions about how to
# shape NODES. Declaring them here is not enough: a system item is a template VARIABLE, and until
# 2026-09-18 system.j2 referenced none of these three, so the prefs the user wrote for the
# orchestrator reached the steward and never the architect. system.j2 renders all three now.
system_context_items:
  - resource_user_data
  - resource_assistant_data
  - resource_orchestrator_user_prefs

# Log the rendered SYSTEM + USER prompts to the agents log on every architect call.
# The architect is invoked directly via work_architect_node, and its prompts are otherwise
# invisible (suppressed by the prompt_debug gate) - seeing the rendered CONTEXT (ticket
# replies, portfolio) is key to verifying re-plan behaviour.
prompt_debug:
  system: true
  user: true

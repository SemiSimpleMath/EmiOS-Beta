name: weekly_meal_planner
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "smart"

# Single-shot strategic planner. Pre-fetched context (inventory + Ralphs +
# concerns + recipes_house + family roster) is enough; the persist layer
# handles google_docs side effects (create/replace the weekly shopping doc).
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  # Timing
  - date_time
  - day_of_week
  - week_start_date
  # The distilled context bundle from meal_context_distiller —
  # carries: horizon_summary, relevant_beliefs (filtered),
  # horizon_wide_concerns, inventory_pressures, per-day notes,
  # additional considerations. Plus anything the
  # weekly_meal_planning::planner researched lands in recent_history.
  - meal_context
  # 4-week history of past plans — drives cadence + variety rules
  # (no repeats within 14 days; fast-food/takeout/dine-out budget).
  - recent_planned_meals
  # Shopping-list mechanics (raw data — not LLM-distillable)
  - inventory_snapshot
  - ralphs_standing_list
  - agent_weekly_list_state
  # Go-to rotation with DUE/RESTING cadence markers (built alongside
  # inventory_snapshot in meal_context_builder; the template references it).
  - easy_meals_rotation

system_context_items:
  - resource_user_data
  - resource_household_food_registry

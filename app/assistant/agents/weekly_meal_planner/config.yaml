name: weekly_meal_planner
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "smart"

# Single-shot strategic planner. Pre-fetched context (inventory + Ralphs +
# concerns + recipes_house + family roster) is enough; the persist layer
# handles google_docs side effects (create/replace the weekly shopping doc).
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - date_time
  - day_of_week
  - week_start_date
  - diet_log_7d
  - inventory_snapshot
  - recipes_house
  - dietary_context
  - food_calendar
  - family_roster
  - addressable_concerns
  - fast_food_count_7d
  - ralphs_standing_list
  - agent_weekly_list_state

system_context_items:
  - resource_user_data
  - resource_meal_proposer_house_rules

# Reads ONE day's insights together with that day's numbered timeline items and writes the atomic
# beliefs they support, each citing the timeline items it rests on. Step 0 + step 1 of
# docs/design/belief_intake_redesign_2026-09-26.md, prototyped as a single agent.
#
# It DECIDES only. Timeline items are numbered by code and restored by code; nothing is written to
# the belief store. Not wired into any pipeline yet — exercised by
# app/assistant/tests/agent_tests/belief_extractor/run_extractor.py.
name: belief_engine::belief_extractor
class_name: Agent
llm_params:
  llm_provider: openai
  engine: gpt-5.6-luna
  model_tier: strong
allowed_tools: []
except_tools: []
user_context_items: [date, insights, timeline_items]
system_context_items: [resource_user_data]

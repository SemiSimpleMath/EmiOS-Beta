# Restates ONE held belief after evidence arrives that bears against it, from the whole dated
# evidence trail. Step 4 ("adjust beliefs based on evidence") of
# docs/design/belief_intake_redesign_2026-09-26.md. Invoked by belief_engine/intake when the dedup
# step returns `contradicts`. It DECIDES only; code writes.
name: belief_engine::belief_revise
class_name: Agent
llm_params:
  llm_provider: openai
  engine: gpt-5.6-luna
  model_tier: strong
allowed_tools: []
except_tools: []
user_context_items: [belief, evidence, new_belief]
system_context_items: [resource_user_data]

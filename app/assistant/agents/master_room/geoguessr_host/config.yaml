name: master_room::geoguessr_host
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-4o"
  model_tier: "powerful"
  temperature: 0.7

allowed_tools: []
except_tools: []

structured_output: AgentForm

system_context_items:
  - resource_assistant_data
  - resource_user_data
  - geoguessr_clue_history
  - geoguessr_best_guess
  - geoguessr_confidence
  - geoguessr_screenshot_count
  - geoguessr_answer_revealed

entity_scan_keys: [incoming_message, recent_history]

user_context_items:
  - geo_session_id
  - incoming_message
  - recent_history

# Canonical example: copy this directory as a starting point for a new agent.
# See skills/extending-emi-agents/SKILL.md for the field reference.
name: master_room::chat_gate
class_name: Agent
action_required: false
llm_params:
  llm_provider: "gemini"
  engine: "gemini-3-flash-preview"
  model_tier: "mini"

allowed_tools: []
except_tools: []
allowed_nodes: []
entity_scan_keys: [incoming_message, task, recent_history]
entity_card_level: 0

enable_keyword_resource_injection: true

user_context_items:
  - date_time
  - task
  - resource_user_data
  - room_allowed_resource_context
  - room_pinned_entities
  - entity_card
  - recent_history
  - user_bio_context
  - health_status_summary
  - resource_weather
  - day_of_week
  - location_summary
  - recent_dayflow_tickets
  - recent_dayflow_items
  - resource_expected_calendar
  - resource_assistant_data
  - chat_memory
  - chat_nudges

system_context_items:
  - room_identity
  - room_conversation
  - room_safety
  - room_facts
  - room_participant_facts

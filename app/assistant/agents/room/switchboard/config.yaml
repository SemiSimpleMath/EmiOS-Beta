name: room::switchboard
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"


allowed_tools: all
# Switchboard's job is ROUTING — pick a manager or no-op. It should never
# pick clarification/leaf tools directly. ask_user is for in-task
# clarification (called BY a manager mid-execution), not for the routing
# decision itself — picking it here means "interrupt to ask the user
# something" when the user just spoke, which is nonsensical at this layer.
# Slack 2026-05-28 case: planner picked ask_user instead of routing to a
# pod-search-capable manager, then crashed with "Missing 'question' argument"
# because it passed manager-shape args (task+information).
except_tools:
  - ask_user
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - action_count
  - room_allowed_global_resources
  - room_allowed_resource_context
  - room_allow_images
  - room_allowed_entity_cards
  - room_pinned_entities
  - room_rag_scopes
  - entity_summary
  - entity_metadata

system_context_items:
  - resource_assistant_data
  - tool_descriptions
  - room_id
  - room_contact_name
  - room_inbound_timestamp_local
  - room_inbound_line
  - room_surface
  - room_context_id
  - room_visibility
  - room_policy_id
  - room_identity
  - room_conversation
  - room_safety
  - room_facts
  - room_participant_facts
  - date_time

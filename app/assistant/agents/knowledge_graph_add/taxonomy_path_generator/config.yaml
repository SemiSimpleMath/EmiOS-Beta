name: taxonomy_path_generator
class_name: Agent
agent_type: structured_output
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "mini"
  timeout: 120
system_prompt_file: prompts/system.j2
user_prompt_file: prompts/user.j2
agent_form: agent_form.py
user_context_items:
  - node_label
  - node_sentence
  - node_type

system_context_items: []


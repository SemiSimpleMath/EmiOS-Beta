name: knowledge_graph_add::fact_extractor
class_name: Agent
llm_params:
  engine: gpt-5.4
  model_tier: "powerful"
  timeout: 240
  llm_provider: "openai"
allowed_tools: []
except_tools: []
user_context_items:
- text
- full_conversation
- date_time
- original_message_timestamp
- entity_level_0
system_context_items:
- resource_assistant_data
- resource_user_data
type: agent

entity_scan_keys: [text]
entity_detection_keys:
  - text

enable_keyword_resource_injection: false

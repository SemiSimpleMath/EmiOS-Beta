name: kg_dev::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4"
  model_tier: "smart"

allowed_tools: [kg_query, pod_search, pod_fetch]
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, recent_history]
entity_card_level: 0

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report
  - action_count

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task
  - date_time

name: daily_meal_proposer
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

# Smaller, faster than weekly planner — tactical day-of decisions don't
# need the smart tier. Single-shot; no tools.
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - date_time
  - day_of_week
  - diet_log_7d
  - inventory_snapshot
  - recipes_house
  - easy_meals_rotation
  - dietary_context
  - food_beliefs
  - food_calendar
  - general_calendar
  - family_roster
  - addressable_concerns
  - fast_food_count_7d
  - latest_weekly_plan
  - ralphs_standing_list
  - weekly_schedule

system_context_items:
  - resource_user_data
  - resource_meal_proposer_house_rules

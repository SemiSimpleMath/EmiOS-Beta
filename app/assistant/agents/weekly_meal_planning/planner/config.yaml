name: weekly_meal_planning::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

# Cheap. Most cycles this agent runs one cycle and immediately returns
# control. Only when it spots a real gap (unfamiliar audience member,
# restaurant lookup needed) does it call meal_research_manager. Mini
# tier is fine for that judgment.

allowed_tools: []     # populated by the manager-level tools list
except_tools: []
allowed_nodes: [return_control]

# Reads the distilled meal_context (produced by meal_context_distiller
# upstream) — not the raw seed. The distiller has already done the
# relevance work; this planner only judges whether the bundle has any
# obvious gap that warrants a meal_research_manager call (typically:
# an audience member with no dietary profile, e.g. Marika visiting).
user_context_items:
  - date_time
  - day_of_week
  - week_start_date
  - meal_context
  - recent_history
  - action_count

system_context_items:
  - tool_descriptions

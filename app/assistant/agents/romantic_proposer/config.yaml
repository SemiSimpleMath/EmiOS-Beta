name: romantic_proposer
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

# Single daily romantic-relationship brain — date nights, small
# gestures, anniversary prep, quality time. Mints intention.romantic
# pods. No tools for v0.
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - date_time
  - day_of_week
  - relationship_signal_30d
  - food_calendar
  - wellness_calendar
  - general_calendar
  - family_roster
  - addressable_concerns
  - recent_romantic_intentions
  - key_dates

system_context_items:
  - resource_user_data
  - resource_romantic_proposer_house_rules

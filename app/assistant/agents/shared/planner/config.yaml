name: shared::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"
  

allowed_tools: all
except_tools: [emi_team]
allowed_nodes: [shared::writer, shared::mathematician, return_control]

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - action_count

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task
  - resource_user_data
  - resource_assistant_data





name: shared::writer
class_name: Agent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

allowed_nodes: [return_control]

system_context_items:
  - resource_user_data
  - resource_assistant_data

user_context_items:
  - date_time
  - writer_task
  - writer_context
  - purpose
  - audience
  - tone
  - length
  - format_constraints


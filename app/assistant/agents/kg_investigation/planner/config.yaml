name: kg_investigation::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.1"
  model_tier: "smart"

# Curated to kg_query only — see manager config rationale.
# Read-only investigator; SQLite reaches everything via SQL.
allowed_tools:
  - kg_query
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]
# L0 = one-liner identity only (e.g. "Annika: oldest daughter of Jukka").
# Avoids injecting the entity card's `key_facts` — those are often the
# very claims under investigation, and including them would prime the
# investigator with the disputed content. L0 gives just enough context
# to disambiguate entity references; the investigator queries kg_query
# for any fact-level information.
entity_card_level: 0

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report
  - entity_card

system_context_items:
  - tool_descriptions
  - task
  - resource_kg_node_reading
  - action_count

# Same triage doctrine as kg_resolution::planner: three-bucket triage,
# data-quality sanity check, stop-early convergence, provenance JOIN
# walks. Auto-injected on contradiction-flavored task keywords too —
# static-bind because investigation IS the conflict-triage job.
skills:
  - kg-conflict-triage

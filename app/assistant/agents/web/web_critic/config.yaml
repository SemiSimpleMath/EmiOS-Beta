name: web_critic
class_name: PlaywrightAgent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

allowed_tools: []
except_tools: []

user_context_items:
  - date_time
  - task
  - information
  - tool_descriptions
  - allowed_nodes
  - critic_payload
  - critic_intended_action_input
  - recent_history
  - manager_loop_number
  - manager_loop_count
  - planned_tool_name
  - planned_tool_arguments
  - web_critic_image
  - web_critic_trigger_reason

system_context_items:
  - task


name: web::planner
class_name: Planner
llm_params:
  llm_provider: "gemini"
  engine: "gemini-3-flash-preview"
  model_tier: "mini"
  temperature: 1
  

allowed_nodes: [shared::writer, shared::mathematician]

# Curated tool list. Previously was `all` (149 tools), which produced
# such a long tool_descriptions list in the system prompt that the model
# didn't notice search_web and instead resorted to find_tool — which
# returned only find_tool + ask_user, so the model hallucinated a
# "google_search" tool name and crashed (Amy Santiago / Brooklyn 99
# incident, 2026-05-01). Keeping the list short makes search_web the
# obvious primary action.
allowed_tools:
  - search_web
  - scrape_url
  - http_request
  - web_get_content
  - peak_at_link
  - summarize_link
  - web_navigate_snapshot
  - web_visual_scout
  - web_modal_scan
  - find_tool
  - ask_user

except_tools: [emi_team]

append_fields: [progress_report]

user_context_items:
  - date_time
  - task
  - information
  - orchestrator_global_objective
  - orchestrator_global_guidance
  - orchestrator_job_id
  - orchestrator_job_guidance
  - progress
  - recent_history
  - checklist
  - action_count
  - progress_report

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - system_wide_task

skills:
  - critic-handling




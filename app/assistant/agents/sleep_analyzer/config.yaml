name: sleep_analyzer
class_name: Agent
llm_params:
  llm_provider: "openai"
  # Vision-capable. Same model the shared::vision_image_describe agent uses.
  engine: "gpt-4o"
  model_tier: "powerful"
  temperature: 0.2

allowed_tools: []
except_tools: []

structured_output: AgentForm

system_context_items: []

user_context_items:
  - date_time
  - image
  - previous_image
  - has_previous
  - camera_id
  - captured_at_utc

# Note: this agent is invoked per-event by the subscriber in
# app/assistant/ring_analysis/subscribers.py. It does NOT register an
# event handler itself — keeps it a pure single-shot input→output agent.

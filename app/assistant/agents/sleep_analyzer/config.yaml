name: sleep_analyzer
class_name: Agent
llm_params:
  llm_provider: "openai"
  # Vision-capable, cheapest OpenAI vision tier. gpt-5.4-mini was ~6x pricier on
  # output for the same asleep/awake scene classification. Snapshot is downscaled
  # to 768px upstream to keep image input tokens low.
  engine: "gpt-5.4-nano"
  model_tier: "mini"

allowed_tools: []
except_tools: []


system_context_items: []

user_context_items:
  - date_time
  - image
  - previous_image
  - has_previous
  - camera_id
  - captured_at_utc

# Note: this agent is invoked per-event by the subscriber in
# app/assistant/ring_analysis/subscribers.py.

name: image_pod_captioner
class_name: OneShotAgent
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4"
  model_tier: "powerful"
  temperature: 0.2

# Generic image-pod enrichment. Vision + surrounding chat → write
# one_liner + body + tags back to the pod. Runs async after a chat-
# attachment image pod is minted (process_request.py spawns a thread).
# Powerful tier for vision quality; speed is fine because async.
allowed_tools: []
except_tools: []

structured_output: AgentForm

system_context_items:
  - resource_user_data

user_context_items:
  - date_time
  - image
  - image_filename
  - trigger_message
  - chat_context_block

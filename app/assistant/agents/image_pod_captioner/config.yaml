name: image_pod_captioner
class_name: OneShotAgent
llm_params:
  llm_provider: "openai"
  model_tier: "mini"

# Generic image-pod enrichment. Vision + surrounding chat → write
# one_liner + body + tags back to the pod. Runs on the describer pool
# for every image pod minted without a description
# (pod_store/image_pod_enrichment.py).
allowed_tools: []
except_tools: []


system_context_items:
  - resource_user_data

user_context_items:
  - date_time
  - image
  - image_filename
  - trigger_message
  - chat_context_block

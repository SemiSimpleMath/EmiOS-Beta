name: weekly_meal::context_planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "smart"

# Context-gather planner for weekly_meal_manager. Reads the seeded
# context (built by build_weekly_meal_planner_context), reasons about
# whether additional signals are needed for the week ahead, fetches via
# tools where genuine gaps exist, returns control to weekly_meal_planner
# when the bundle is ready.
#
# Tool palette is the manager-level set; not narrowed further here.
allowed_tools: []
except_tools: []
allowed_nodes: [return_control]
accept_auto_skills: false

# Read the seed once; reasoning happens against recent_history each cycle.
user_context_items:
  - date_time
  - day_of_week
  - week_start_date
  - inventory_snapshot
  - diet_log_7d
  - dietary_context
  - food_beliefs
  - food_calendar
  - family_roster
  - addressable_concerns
  - fast_food_count_7d
  - recent_history
  - action_count
# Dropped:
#   - recipes_house: a 122-char stub that just redirects to
#     resource_meal_proposer_house_rules (loaded in system_context_items
#     below). The redirect was prompt noise.
#   - ralphs_standing_list: staples Jukka always buys at Ralphs. That's
#     shopping-list-generation input, used by weekly_meal_planner when
#     it emits WeeklyShoppingList. Not relevant to meal-decision-time
#     reasoning; belongs only downstream.

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - resource_user_data
  - resource_assistant_data
  - resource_meal_proposer_house_rules
  - resource_subconscious_context_planner

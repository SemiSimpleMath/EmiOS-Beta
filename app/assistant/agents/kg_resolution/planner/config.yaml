name: kg_resolution::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.5"
  model_tier: "smart"

# Full mutator suite. Safety rails live in the workflow, not in
# tool exclusion: investigator's disposition decision routes to dev
# page (24h grace) or user queue, and the dev-page Accept button is
# the explicit human approval before mutations land. The executor's
# name is "executor" — it should be able to execute.
# kg_query for reads. Wiki + entity card regen stay out-of-band
# (wiki: nightly bullet-text-diff; cards: stale_content_scan daily).
allowed_tools:
  - kg_query
  - kg_close_state
  - kg_create_state_node
  - kg_update_node_field
  - kg_rename_label
  - kg_create_edge
  - kg_delete_edge
  - kg_delete_node
  - kg_merge_nodes
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]
entity_card_level: 2

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report
  - action_count
  - entity_card

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task
  - resource_kg_node_reading

# kg-conflict-triage is the combined doctrine + playbook. Absorbs what
# used to be 3 separate resource files (kg_principles, wiki_principles,
# entity_card_principles) which had heavy duplication.
skills:
  - kg-conflict-triage

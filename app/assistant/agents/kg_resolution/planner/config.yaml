name: kg_resolution::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.5"
  model_tier: "smart"

# Curated to the 3 essentials. Wiki + entity card regen are out-of-band
# (wiki: nightly bullet-text-diff refresh; cards: stale_content_scan +
# planned generation-on-mutation, see TODO). The executor purely
# mutates the KG; downstream derivatives auto-refresh.
# Dropped: pod_search/pod_fetch (kg_query covers reads),
# kg_create_state_node, kg_rename_label, kg_create_edge,
# kg_delete_edge, kg_delete_node (rare; the executor escalates if the
# recommendation needs them), kg_finding_resolve, kg_finding_escalate
# (verdict carried in structured final-answer instead),
# regenerate_entity_card, refresh_wiki_page (out-of-band).
allowed_tools:
  - kg_query
  - kg_close_state
  - kg_update_node_field
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]
entity_card_level: 2

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report
  - action_count
  - entity_card

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task
  - resource_kg_node_reading

# kg-conflict-triage is the combined doctrine + playbook. Absorbs what
# used to be 3 separate resource files (kg_principles, wiki_principles,
# entity_card_principles) which had heavy duplication.
skills:
  - kg-conflict-triage

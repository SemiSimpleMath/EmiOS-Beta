name: kg_resolution::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.5"
  model_tier: "smart"

# Mirror kg_resolution_manager's curated suite (per
# feedback_curated_allowed_tools — `all` makes the planner hallucinate
# tool names and bloats the prompt with 100+ irrelevant descriptions).
# READ:    kg_query, pod_search, pod_fetch
# MUTATE:  kg_close_state, kg_create_state_node, kg_update_node_field,
#          kg_rename_label, kg_create_edge, kg_delete_edge, kg_delete_node
# REGEN:   regenerate_entity_card, refresh_wiki_page
# LIFECYCLE: kg_finding_resolve, kg_finding_escalate
allowed_tools:
  - kg_query
  - pod_search
  - pod_fetch
  - kg_close_state
  - kg_create_state_node
  - kg_update_node_field
  - kg_rename_label
  - kg_create_edge
  - kg_delete_edge
  - kg_delete_node
  - kg_finding_resolve
  - kg_finding_escalate
  - regenerate_entity_card
  - refresh_wiki_page
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]
entity_card_level: 2

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report
  - action_count
  - entity_card

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task
  - resource_kg_node_reading
  - resource_kg_principles
  - resource_wiki_principles
  - resource_entity_card_principles

# Auto-injected via SkillInjector when task keywords match
# (kg_maintenance_finding, contradiction, stale_content, etc.).
# Static-bind anyway since this manager's whole purpose is conflict
# triage — we always want the playbook.
skills:
  - kg-conflict-triage

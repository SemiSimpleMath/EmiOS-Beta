name: http_team::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "mini"


# http_team's job is making HTTP/REST API calls to external services.
# Narrow surface: the planner picks endpoints + composes calls, then
# the http_request leaf actually hits the network. Multi-step API
# flows (createSession → use accessJwt → next call) are explicit
# concerns of THIS planner — read_tool_result is load-bearing so the
# planner can pluck fields like accessJwt out of prior responses.
#
# Domain skills (Bluesky AT Protocol, future Mastodon/Reddit/GitHub
# patterns) auto-attach when the task text matches — they live as
# top-level skills/ entries and auto_inject_when triggers on the
# task ferries them in.
allowed_tools:
  - http_request
  - oauth_token_refresh
  - pod_search
  - pod_fetch
  - mint_pod_from_path
  - read_tool_result
  - ask_user
  - discover_skills
  - read_skill
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]
entity_card_level: 0

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report
  - action_count
  - entity_card
  - referenced_pods_block
  - task_includes
  - task_resource_context
  - available_accounts

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task
  - date_time

# critic-handling is the only base skill. Domain skills (Bluesky,
# Mastodon, GitHub, etc.) auto-inject via SKILL.md auto_inject_when
# keywords on the task text.
skills:
  - critic-handling
accept_auto_skills: true

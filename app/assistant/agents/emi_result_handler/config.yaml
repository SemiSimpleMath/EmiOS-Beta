name: emi_result_handler
class_name: EmiResultHandler
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

user_context_items:
  - date_time
  - final_answer_task
  - final_answer_answer
  - final_answer_detail_level
  - final_answer_what_was_done
  - final_answer_interesting_info
  - final_answer_sources
  - final_answer_data_list

system_context_items:
  - resource_user_data

events:
  - emi_result_request

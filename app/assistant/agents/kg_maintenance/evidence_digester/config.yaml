name: kg_maintenance::evidence_digester
class_name: Agent
action_required: false
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.6-luna"
  model_tier: "fast"

# Pure writing: dated evidence rows in, one consolidated chronicle out.
# No tools.
allowed_tools: []
except_tools: []
allowed_nodes: []
accept_auto_skills: false

user_context_items:
  - agent_input

# Prompt guards: judging on empty input is the failure mode (2026-06-12);
# refuse loudly instead. Strict templates raise on undefined variables.
required_context_items:
  - agent_input
strict_template: true

system_context_items: []

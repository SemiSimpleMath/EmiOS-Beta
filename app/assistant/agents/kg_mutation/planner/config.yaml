name: kg_mutation::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5.4-mini"
  model_tier: "mini"

allowed_tools: all
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [incoming_message, task, information, recent_history]
entity_card_level: 1

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report

system_context_items:
  - tool_descriptions
  - task
  - resource_kg_node_reading

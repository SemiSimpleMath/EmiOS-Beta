name: personal_admin::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

# Curated list — was `all` (149 tools) which bloated prompt + leaked
# off-domain guidance (pod search workflow, KG mutations, etc.) into
# every personal_admin call. personal_admin's job is email + calendar
# + todos + reminders. Pod work here is "act on a pod the task already
# named" (attach via send_email pod_ids, fetch to read), NOT pod search
# — that's emi_team's job per resource_pod_skill_admin.
allowed_tools:
  # Email — read/find/send/triage
  - send_email
  - get_email
  - get_email_messages
  - get_email_thread
  - get_important_emails
  - get_email_stats
  - trash_emails
  # Calendar
  - create_calendar_event
  - create_repeating_calendar_event
  - update_calendar_event
  - delete_calendar_event
  - delete_repeating_calendar_event
  - find_calendar_event_by_name
  - get_calendar_events
  # Todos
  - create_todo_task
  - delete_todo_task
  - get_todo_tasks
  # Scheduler / reminders
  - create_scheduler_event
  - create_repeating_scheduler_event
  - delete_scheduler_event
  - get_scheduler_events
  # User interaction
  - ask_user
  # Pod actions on a pod_id the task already references — read body.
  # (Attaching is via send_email's pod_ids field, no extra tool needed.)
  - pod_fetch
except_tools: []
allowed_nodes: [personal_admin::final_answer]
entity_scan_keys: [incoming_message, task, information, recent_history]
# personal_admin's job is email/calendar/todo/reminders. For each entity it
# only needs the name (level_0) + how to reach them (contact). The L3
# superset would also pull in life-context facts (where_they_are,
# what_they_do, notes) which are irrelevant for routing email or scheduling
# events. `entity_card_sections` overrides the level for the entity_card key.
entity_card_level: 3
entity_card_sections:
  - level_0
  - contact

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - resource_user_email
  - resource_email_accounts
  - entity_card
  - referenced_pods_block

system_context_items:
  - tool_descriptions
  - resource_personal_admin_user_prefs
  - date_time
  - allowed_nodes
  - task

# Skill resources injected into the system prompt only when the task or
# inbound message contains a matching keyword. Saves prompt budget on
# tasks where the skill is not relevant.
#
# personal_admin's responsibility is acting on pods (attaching to
# email, fetching to read) — NOT searching for them. Finding pods is
# emi_team's job (see emi_team/planner/config.yaml). When a task
# arrives here with pod_ids already in it, the pod-courier skill
# teaches the right tool composition.
#
# Triggers live on the skills (skills/pod-courier/SKILL.md auto_inject_when).
accept_auto_skills: true

name: personal_admin::planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

allowed_tools: all
except_tools: []
allowed_nodes: [personal_admin::final_answer]
entity_scan_keys: [incoming_message, task, information, recent_history]
entity_card_level: 3

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - tool_descriptions
  - resource_user_email
  - entity_card
  - referenced_pods_block

system_context_items:
  - tool_descriptions
  - resource_personal_admin_user_prefs

# Skill resources injected into the system prompt only when the task or
# inbound message contains a matching keyword. Saves prompt budget on
# tasks where the skill is not relevant.
#
# personal_admin's responsibility is acting on pods (attaching to
# email, fetching to read) — NOT searching for them. Finding pods is
# emi_team's job (see emi_team/planner/config.yaml). When a task
# arrives here with pod_ids already in it (or in referenced_pods), the
# admin skill teaches the right tool composition.
#
# Trigger keywords are narrow: explicit pod URI scheme, "attach"-
# shaped vocabulary, and "email" in combination with media kinds (which
# is what implies "act on a pod" rather than "find a pod").
task_keyword_resources:
  datapod: resource_pod_skill_admin
  attach: resource_pod_skill_admin
  attached: resource_pod_skill_admin
  attachment: resource_pod_skill_admin
  forward: resource_pod_skill_admin
  unfurl: resource_pod_skill_admin
  pod_id: resource_pod_skill_admin

# work_web_manager::planner — web::planner's research agent (its model, tools, notebook, skills) adapted
# to OWN a WorkObject graph node. Deltas vs app/assistant/agents/web/planner/config.yaml:
#   class_name: Planner -> WorkPlanner       (mirrors checklist -> subtask nodes + findings_to_pod -> pods)
#   + work_graph_peek / work_graph_search    (hydrate a ·has-output node before searching)
#   user_context_items: work_projection (the render node injects YOUR NODE + checklist with [id]s)
#                       replaces task / information / checklist — the graph IS the task + checklist now.
# The prompts (system.j2 / user.j2) are derived from web/planner's — see their headers, keep in sync.
name: work_web_manager::planner
class_name: WorkPlanner
llm_params:
  llm_provider: "gemini"
  engine: "gemini-3-flash-preview"
  model_tier: "mini"
  temperature: 1

allowed_nodes: [shared::writer, shared::mathematician]

allowed_tools:
  - search_web
  - scrape_url
  - http_request
  - web_get_content
  - peak_at_link
  - summarize_link
  - web_navigate_snapshot
  - web_visual_scout
  - web_modal_scan
  - find_tool
  - ask_user
  # read-only graph tools: hydrate another node's output (·has-output in THE WORK TREE) before searching
  - work_graph_peek
  - work_graph_search

except_tools: [emi_team]

append_fields: [progress_report]

user_context_items:
  - date_time
  - work_projection      # the render node injects the owned node + checklist (with [id]s) here
  - research_notebook    # units already podded (so it doesn't re-pod)
  - recent_history
  - action_count

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - system_wide_task

skills:
  - critic-handling

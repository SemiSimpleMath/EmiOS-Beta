name: me::query_planner
class_name: Planner
llm_params:
  llm_provider: "openai"
  engine: "gpt-5-mini"
  model_tier: "mini"

allowed_tools: [kg_query]
except_tools: []
allowed_nodes: [return_control]
entity_scan_keys: [task]
entity_card_level: 0

user_context_items:
  - date_time
  - task
  - information
  - recent_history
  - checklist
  - progress_report
  - action_count

system_context_items:
  - tool_descriptions
  - allowed_nodes
  - task

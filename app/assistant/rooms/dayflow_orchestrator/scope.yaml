# Permission scope for dayflow_orchestrator — the autonomous orchestration room.
#
# PERMISSION ONLY. Declares what callers in this room may DO and SEE.
# Room/session behavior (history, retention mode, manager overrides) stays in
# ROOM.md. Identity (scope_id, owner_id, actor_id, surface, reply_to, ...) is
# stamped per request at load time — never authored here.
#
# Mirrors master_room's permission set (owner-trust orchestrator), with ONE
# deliberate difference: authority_level 95 (master_room is 99). dayflow_
# orchestrator is the autonomous engine that acts on the owner's behalf across
# every surface; it runs just below the owner's own room. The 95-vs-99 gap is
# intentional — master_room (the owner) outranks the orchestrator.
#
# Full tool surface, all pods (cross-room owner visibility for event
# correlation — see ROOM.md), KG writes + fact extraction enabled, auto-send
# enabled.
#
# The one per_manager rule below mirrors master_room's and is NOT a capability
# cut — it's a narrower-cost reduction. emi_team_manager otherwise runs the LLM
# tool_narrower over its full ~138-tool surface (~90KB prompt) on EVERY call;
# restricting its DIRECT pool to the 7 delegate-managers + ask_kg + operational
# tools collapses that to ~16 with zero loss of reach — the ~120 specialist
# leaves stay reachable THROUGH those managers (http_request via http_manager,
# calendar CRUD via personal_admin, etc.).
#
# NOTE: write_kg / allow_fact_extraction / pods:[all] / entities:[all] are MORE
# permissive than the model defaults and MUST be declared explicitly — omitting
# them would silently downgrade the room to the fail-closed floor.

approval:
  authority_level: 95

tools:
  allowed_tools: [all]
  allow_external_side_effects: true
  per_manager:
    # Narrower-cost reduction only (see header), mirrors master_room. emi_team's
    # DIRECT pool = the managers it delegates to + ask_kg + its operational tools;
    # specialist leaves stay reachable through those managers.
    emi_team_manager:
      allow:
        - personal_admin_manager
        - devices_manager
        - web_manager
        - playwright_manager
        - bash_manager
        - http_manager
        - sandbox_manager
        - find_tool
        - install_tool
        - ask_user
        - pod_search
        - pod_fetch
        - mint_pod
        - ask_kg
        - discover_skills
        - read_skill

pods:
  allowed_scopes: [all]

resources:
  allowed_global_resources: [all]
  resource_groups:
    - chat
    - memory

entities:
  enabled: true
  allowed_entity_cards: [all]

writes:
  write_unified_log: true
  write_kg: true
  allow_fact_extraction: true

delivery:
  auto_send: true
  allow_initiation: true

# Permission scope for the SMS room (room_id "1234").
#
# PERMISSION ONLY. Room/session behavior stays in ROOM.md. Identity is stamped
# per request at load time — never authored here.
#
# LOCKED DOWN: no tools. SMS has never been used as an action surface and is the
# lowest-trust transport. The ONLY deliberate change from the prior builder
# output is tools.allowed_tools [all] -> [] (no tool can execute). Everything
# else (authority 40, resources, entities, writes, delivery) is faithful to the
# prior behavior — locking tools does not change what context Emi may read.
# A specific SMS number that should have action access would override this with
# its own scope.yaml (same opt-in pattern as Katy on Telegram).

approval:
  authority_level: 40

tools:
  allowed_tools: []          # no tools — pure chat (fail-closed). The lockdown.
  allow_external_side_effects: false

pods:
  allowed_scopes: [self]

resources:
  allowed_global_resources:
    - resource_chat_guidelines
    - resource_user_data
    - resource_assistant_data
    - resource_user_email
  resource_groups:
    - chat

entities:
  enabled: true
  allowed_entity_cards: [all]

writes:
  write_unified_log: true
  write_kg: false
  allow_fact_extraction: false

delivery:
  auto_send: true
  allow_initiation: false

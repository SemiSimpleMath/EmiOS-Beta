# Permission scope for master_room — the owner's primary UI surface.
#
# PERMISSION ONLY. Declares what callers in this room may DO and SEE.
# Room/session behavior (history, retention, mode_manager_overrides) stays in
# ROOM.md. Identity (scope_id, owner_id, actor_id, surface, reply_to, ...) is
# stamped per request at load time — never authored here.
#
# master_room is authority 99 — the highest-trust room. Full tool surface, all
# pods (cross-room owner visibility), KG writes + fact extraction enabled,
# external side effects allowed.
#
# The one per_manager rule below is NOT a capability cut — it's a narrower-cost
# reduction. emi_team_manager runs the LLM tool_narrower over its full ~138-tool
# surface (~90KB prompt) on every call. Restricting its DIRECT pool to the 7
# delegate-managers + kg_query + its operational tools collapses that to ~16 with
# zero loss of reach: the ~120 specialist leaf tools are still reachable THROUGH
# those managers (http_request via http_manager, calendar CRUD via personal_admin,
# etc.). Mirrors emi_team's own tool_visibility.always_show + kg_query_manager.
#
# NOTE: several of these are MORE permissive than the model defaults
# (write_kg, allow_fact_extraction, allow_external_side_effects, pods:[all],
# entities:[all]) and MUST be declared explicitly — omitting them would
# silently downgrade master_room to the fail-closed floor.

approval:
  authority_level: 99

tools:
  allowed_tools: [all]
  allow_external_side_effects: true
  per_manager:
    # Narrower-cost reduction only (see header). emi_team's DIRECT pool = the
    # managers it delegates to + kg_query + its operational tools; specialist
    # leaves stay reachable through those managers.
    emi_team_manager:
      allow:
        - personal_admin_manager
        - devices_manager
        - web_manager
        - playwright_manager
        - bash_manager
        - http_manager
        - sandbox_manager
        - kg_query_manager
        - find_tool
        - install_tool
        - ask_user
        - pod_search
        - pod_fetch
        - ask_kg
        - discover_skills
        - read_skill

pods:
  allowed_scopes: [all]

resources:
  allowed_global_resources: [all]
  resource_groups:
    - chat
    - memory

entities:
  enabled: true
  allowed_entity_cards: [all]

writes:
  write_unified_log: true
  write_kg: true
  allow_fact_extraction: true

delivery:
  auto_send: true
  allow_initiation: true

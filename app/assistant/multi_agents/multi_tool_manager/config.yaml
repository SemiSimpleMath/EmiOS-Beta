name: multi_tool_manager
class_name: MultiAgentManager
description: "Experimental manager using MultiToolAgent planner for compact tool-sequence execution."
max_cycles: 20
role_bindings:
  delegator: emi_team::delegator

agents:
  - name: emi_team::delegator
    class: Delegator
  - name: multi_tool_agent::planner
    class: MultiToolAgent
  - name: shared::tool_arguments
    class: Agent
  - name: shared::compact_final_answer
    class: Agent

control_nodes:
  - name: tool_caller
    class: ToolCaller
  - name: tool_result_handler
    class: ToolResultHandler
  - name: dag_manager_control_node
    class: DagManagerControlNode
  - name: dag_executor_node
    class: DagExecutorNode
  - name: return_control
    class: ReturnControlNode
  - name: manager_exit_node
    class: ManagerExitNode
  - name: graceful_exit_control_node
    class: GracefulExitControlNode

tools:
  allowed_tools:
    - capture_and_describe_monitors
    - find_tool
    - web_manager
    - set_screen_capture_enabled
    - capture_monitor_screenshot
    - vision_image_describe
    - write_text_file
    - read_text_file
  except_tools: []

flow_config:
  state_map:
    "emi_team::delegator": "multi_tool_agent::planner"
    "multi_tool_agent::planner_execute_dag": "dag_manager_control_node"
    "dag_manager_control_node_return_control": "shared::compact_final_answer"
    "dag_executor_node_return_control": "shared::compact_final_answer"
    "shared::tool_arguments": "tool_caller"
    "multi_tool_agent::planner_return_control": "shared::compact_final_answer"
    "shared::compact_final_answer": "manager_exit_node"
    "graceful_exit": "graceful_exit_control_node"
    "graceful_exit_control_node": "shared::compact_final_answer"

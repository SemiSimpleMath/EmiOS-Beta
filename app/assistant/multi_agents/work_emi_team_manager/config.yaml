# Node-graph variant of emi_team_manager. This MIRRORS
# app/assistant/multi_agents/emi_team_manager/config.yaml; the ONLY deltas are the node wiring:
#   node_aware: true   — when called as a tool from inside a WorkObject run, ManagerInterface mints a
#                        child node and runs this manager ON it (manager_interface._run_on_child_node).
#   node_input: render — the workobject_render_node loads the owned node into `work_projection` (YOUR
#                        NODE + YOUR CHECKLIST with [id]s + THE WORK TREE); run_node just says "advance".
#   workobject_render_node added before the planner (delegator-entry + after summary) so it always sees
#                        the current node state.
#   planner: work_emi_team::planner (class WorkPlanner) replaces emi_team::planner — same delegating
#                        generalist; its prompts are DERIVED from emi_team/planner's (delegation, NOT
#                        decompose), and WorkPlanner mirrors the checklist/findings into the graph.
#                        Lives in agents/work_emi_team/planner/.
# Like emi_team_manager, this carries NO scope_contract / tool_visibility: the work "room"
# (orchestrator_scope's per_manager.work_emi_team_manager.allow in work_objects/scope.py) narrows this
# coordinator to its delegate roster — work_web_manager (the node web worker) + the production
# sub-managers + pods + ask_kg — exactly like master_room narrows emi_team. The scope owns the
# narrowing; the manager does not re-declare it.
name: work_emi_team_manager
node_aware: true
node_input: render
class_name: MultiAgentManager
description: "The emi_team general work horse, working on a work-graph node (emi_team + graph reconcile)."
display_name: "Waffle (graph)"
max_cycles: 80  # Prevent infinite loops
role_bindings:
  delegator: emi_team::delegator
  tool_selector: shared::tool_selector
  planner: work_emi_team::planner

agents:
  - name: emi_team::delegator
    class: Delegator
  - name: work_emi_team::planner
    class: WorkPlanner
  - name: emi_team::critic
    class: PlaywrightAgent
  - name: work_emi_team::summary
    class: Agent
  - name: emi_team::final_answer
    class: Agent

control_nodes:
  - name: workobject_render_node
    class: WorkObjectRenderNode
  - name: tool_return_router
    class: ToolReturnRouter
  - name: critic_pre_node
    class: CriticPreNode
    config:
      enabled: true
      critic_agent: "emi_team::critic"
      continue_agent: "tool_caller"
  - name: critic_post_node
    class: CriticPostNode
    config:
      critic_agent: "emi_team::critic"
  - name: summary_pre_node
    class: SummaryPreNode
    config:
      enabled: true
      summary_agent: "work_emi_team::summary"
      resume_agent: "work_emi_team::planner"
  - name: summary_post_node
    class: SummaryPostNode
    config:
      summary_agent: "work_emi_team::summary"
      resume_agent: "work_emi_team::planner"
  - name: tool_caller
    class: ToolCaller
  - name: tool_result_handler
    class: ToolResultHandler
  - name: tool_approve_node
    class: ToolApproveNode
  - name: return_control
    class: ReturnControlNode
  - name: manager_exit_node
    class: ManagerExitNode
  - name: graceful_exit_control_node
    class: GracefulExitControlNode

tools:
  allowed_tools: [all]
  except_tools: [work_emi_team_manager, run_routine]

flow_config:
  tool_return:
    tool_call_result_handler_node: "tool_result_handler"
  summary:
    enabled: true
    source_agent: "tool_return_router"
    summary_agent: "work_emi_team::summary"
    resume_agent: "work_emi_team::planner"
    planner_agent: "work_emi_team::planner"
    cadence_every_actions: 4
    action_count_state_key: "{planner_agent}_action_count"
    min_messages: 30
    trigger_on_large_result_chars: 5000
    payload_key: "summary_payload"
    payload_recent_history_messages: 120
    allow_summarize_latest_tool_result: false
    protect_last_n_results: 3
  state_map:
    "emi_team::delegator": "workobject_render_node"
    "workobject_render_node": "work_emi_team::planner"
    "work_emi_team::planner": "critic_pre_node"
    "emi_team::critic": "critic_post_node"
    "tool_result_handler": "tool_return_router"
    "tool_return_router": "summary_pre_node"
    "summary_pre_node": "workobject_render_node"
    "work_emi_team::summary": "summary_post_node"
    "summary_post_node": "workobject_render_node"
    "work_emi_team::planner_return_control": "emi_team::final_answer"
    "emi_team::final_answer": "manager_exit_node"
    "graceful_exit": "graceful_exit_control_node"
    "graceful_exit_control_node": "emi_team::final_answer"

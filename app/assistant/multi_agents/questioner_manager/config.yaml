name: questioner_manager
class_name: MultiAgentManager
description: "Manager for KG repair pipeline questioner agent - handles user interaction for problematic nodes"
max_cycles: 10
role_bindings:
  delegator: shared::delegator
  tool_selector: shared::tool_selector

agents:
  - name: shared::delegator
    class: Delegator
  - name: kg_repair_pipeline::questioner::planner
    class: Planner
  - name: shared::tool_arguments
    class: Agent

tools:
  allowed_tools: [ask_user, ask_kg]
  except_tools: []

control_nodes:
  - name: tool_caller
    class: ToolCaller
  - name: tool_result_handler
    class: ToolResultHandler
  - name: return_control
    class: ReturnControlNode
  - name: manager_exit_node
    class: ManagerExitNode

flow_config:
  state_map:
    "shared::delegator": "kg_repair_pipeline::questioner::planner"
    "shared::tool_arguments": "tool_caller"
    "kg_repair_pipeline::questioner::planner_return_control": "manager_exit_node"

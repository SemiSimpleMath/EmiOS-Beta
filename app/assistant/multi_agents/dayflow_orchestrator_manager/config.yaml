name: dayflow_orchestrator_manager
class_name: MultiAgentManager
description: "Internal dayflow orchestration manager with triage, state mover, action selector, and switchboard."
max_cycles: 40

role_bindings:
  delegator: room::delegator
  tool_selector: shared::tool_selector

agents:
  - name: room::delegator
    class: Delegator
  - name: dayflow_orchestrator::intake_triage
    class: Agent
  - name: dayflow_orchestrator::state_mover
    class: Agent
  - name: dayflow_orchestrator::action_selector
    class: Agent
  - name: dayflow_orchestrator::strategic_planner_wo
    class: Agent
  - name: dayflow_orchestrator::plan_mode
    class: Agent
  - name: dayflow_orchestrator::switchboard
    class: Agent
  - name: dayflow_orchestrator::work_finalizer
    class: Agent

control_nodes:
  - name: tick_router_node
    class: TickRouterNode
  - name: intake_triage_prep_node
    class: IntakeTriagePrepNode
  - name: state_mover_prep_node
    class: StateMoverPrepNode
  - name: triage_spawn_guard_node
    class: TriageSpawnGuardNode
  - name: triage_persist_node
    class: TriagePersistNode
  - name: context_enricher_prep_node
    class: ContextEnricherPrepNode
  - name: context_enricher_persist_node
    class: ContextEnricherPersistNode
  - name: state_mover_persist_node
    class: StateMoverPersistNode
  - name: strategic_planner_wo_prep_node
    class: StrategicPlannerWoPrepNode
  - name: strategic_planner_wo_persist_node
    class: StrategicPlannerWoPersistNode
  - name: work_architect_node
    class: WorkArchitectNode
  - name: work_node_wake_router_node
    class: WorkNodeWakeRouterNode
  - name: work_node_materializer_node
    class: WorkNodeMaterializerNode
  - name: work_node_dispatch_node
    class: WorkNodeDispatchNode
  - name: action_selector_router_node
    class: ActionSelectorRouterNode
  - name: plan_mode_final_router_node
    class: PlanModeFinalRouterNode
  - name: post_room_finalize_node
    class: PostRoomFinalizeNode
  - name: return_control
    class: ReturnControlNode
  - name: tool_caller
    class: ToolCaller
  - name: tool_result_handler
    class: ToolResultHandler
  - name: final_answer_node
    class: FinalAnswerNode
  - name: manager_exit_node
    class: ManagerExitNode
  - name: graceful_exit_control_node
    class: GracefulExitControlNode

tools:
  allowed_tools:
    # --- Top-level managers (switchboard delegates here) ---
    - emi_team_manager
    - personal_admin_manager
    - web_manager
    - devices_manager

    # --- Direct action tools the switchboard/orchestrator calls itself ---
    - one_shot_tool_runner
    - create_dayflow_ticket
    - work_emi_team_manager
    - run_task
    - find_tool
    - ask_user

    # --- Exotic system-control tools owned by dayflow orchestrator ---
    - set_ui_mute
    - set_screen_capture_enabled

    # --- KG context lookup ---
    - ask_kg
  except_tools: []

scope_contract:
  tools:
    allowed_tools: ["all"]
    blocked_tools:
      - install_tool
      - mcp::npm/playwright-mcp::browser_run_code
    requires_approval_tools: []

flow_config:
  strict_routing: true
  flow:
    normal:
      source_agent: "tick_router_node"
    planning_mode:
      source_agent: "dayflow_orchestrator::plan_mode"
  action_selector:
    source_agent: "dayflow_orchestrator::action_selector"
    switchboard_agent: "dayflow_orchestrator::switchboard"
    final_node: "final_answer_node"
    exit_flag_key: "handoff_tf"
    no_chat_path: true
    switchboard_task_key: "switchboard_task"
    switchboard_information_key: "switchboard_information"
  planning_mode:
    source_agent: "dayflow_orchestrator::plan_mode"
    final_node: "final_answer_node"
    chat_response_key: "chat_response"
    planning_done_key: "planning_done_tf"
    plan_summary_key: "plan_summary"
  state_map:
    "room::delegator": "tick_router_node"
    "tick_router_node": "intake_triage_prep_node"
    "intake_triage_prep_node": "dayflow_orchestrator::intake_triage"
    "dayflow_orchestrator::intake_triage": "triage_spawn_guard_node"
    "triage_spawn_guard_node": "triage_persist_node"
    "triage_persist_node": "context_enricher_prep_node"
    "context_enricher_prep_node": "context_enricher_persist_node"
    # --- WORK-OBJECT planner path (live): steward EVALUATES → architect (re)plans → repair
    #     adjudicates failures → state_mover promotes → the materializer/switchboard pick ONE
    #     node, and the tail of this map calls a tool for it and judges the result. The call
    #     BLOCKS this run; concurrency is another orchestrator instance, not a thread here. ---
    "context_enricher_persist_node": "strategic_planner_wo_prep_node"
    "strategic_planner_wo_prep_node": "dayflow_orchestrator::strategic_planner_wo"
    "dayflow_orchestrator::strategic_planner_wo": "strategic_planner_wo_persist_node"
    # The finalizer is NOT here any more — it is part of the tool return path at the tail
    # of this map, so a result is judged in the same pass that produced it rather than a
    # tick later. The architect therefore plans against nodes the finalizer has already
    # closed, instead of against last pass's unjudged results.
    "strategic_planner_wo_persist_node": "work_architect_node"
    # work_repair_node was here, and is retired (2026-09-16). Its three dispositions each
    # belong to an agent that can see more than one failed step:
    #   retry    -> the finalizer's `replan`, which must NAME what will be different (an
    #               unchanged retry reproduces its error — 22 identical attempts in two hours)
    #   escalate -> asking the user is just a node with a communicate goal; the architect plans it
    #   abandon  -> the steward's, which sees every work object every run
    # A failure reached outside a dispatch (sweeper, claim error) is not stranded either: it
    # sits `failed`, the steward sees it in the projection and flags the work object into
    # replan_work_ids, and the architect re-plans it. Keeping repair alongside the finalizer
    # meant two agents judging the same failure, and repair could answer `abandon_goal` on a
    # node the finalizer had deliberately left to the steward.
    # Its node + agent files remain on disk, unwired.
    "work_architect_node": "state_mover_prep_node"
    "state_mover_prep_node": "dayflow_orchestrator::state_mover"
    "dayflow_orchestrator::state_mover": "state_mover_persist_node"
    # A targeted time-wake pass rejoins here: the state_mover has judged the moment, and
    # work_node_wake_router_node either dispatches that one node or ends the pass. On a normal
    # tick it falls through to the materializer.
    "state_mover_persist_node": "work_node_wake_router_node"
    "work_node_wake_router_node": "work_node_materializer_node"
    # relevance_cleaner was retired at the work-object cutover (it cleaned ITEMS; stale items now age
    # out via the freshness windows + tick sweeps). Its agent/node files remain under
    # agents/dayflow_orchestrator/relevance_cleaner + control_nodes/relevance_cleaner_*.py, unwired.
    "work_node_materializer_node": "dayflow_orchestrator::action_selector"
    "dayflow_orchestrator::action_selector": "action_selector_router_node"
    "action_selector_router_node": "dayflow_orchestrator::switchboard"
    "dayflow_orchestrator::plan_mode": "plan_mode_final_router_node"
    "plan_mode_final_router_node": "final_answer_node"
    # The dispatch gate CLAIMS the node and the planning pass ends. The call itself — the
    # arguments node, the tool caller, and the finalizer that judges what comes back — runs in
    # dayflow_dispatch_manager, one room per claimed node on its own thread.
    #
    # Those three stages lived here until 2026-09-17, which made the tick last as long as the
    # tool did. create_dayflow_ticket blocks for the whole ask window, and DayflowScheduler
    # admits one tick at a time while spacing the next from the previous tick's FINISH — so one
    # unanswered notify was an hour in which nothing planned, woke or dispatched. The tick now
    # ends at the claim, which is the state (not the elapsed time) that makes the graph stable
    # enough for the next instance to start.
    "dayflow_orchestrator::switchboard": "work_node_dispatch_node"
    "work_node_dispatch_node": "post_room_finalize_node"
    "post_room_finalize_node": "final_answer_node"
    "final_answer_node": "manager_exit_node"
    "graceful_exit": "graceful_exit_control_node"
    "graceful_exit_control_node": "final_answer_node"

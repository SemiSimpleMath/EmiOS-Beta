name: dayflow_orchestrator_manager
class_name: MultiAgentManager
description: "The dayflow planning tick: work from the brain's list, the architect, state mover, action selector and switchboard."
max_cycles: 40

role_bindings:
  delegator: room::delegator

agents:
  - name: room::delegator
    class: Delegator
  - name: dayflow_orchestrator::state_mover
    class: Agent
  - name: dayflow_orchestrator::action_selector
    class: Agent
  - name: dayflow_orchestrator::switchboard
    class: Agent

control_nodes:
  - name: work_prep_node
    class: WorkPrepNode
  - name: state_mover_prep_node
    class: StateMoverPrepNode
  - name: state_mover_persist_node
    class: StateMoverPersistNode
  - name: brain_list_intake_node
    class: BrainListIntakeNode
  - name: work_architect_node
    class: WorkArchitectNode
  - name: work_node_materializer_node
    class: WorkNodeMaterializerNode
  - name: work_node_dispatch_node
    class: WorkNodeDispatchNode
  - name: action_selector_router_node
    class: ActionSelectorRouterNode
  - name: post_room_finalize_node
    class: PostRoomFinalizeNode
  - name: return_control
    class: ReturnControlNode
  - name: tool_caller
    class: ToolCaller
  - name: tool_result_handler
    class: ToolResultHandler
  - name: final_answer_node
    class: FinalAnswerNode
  - name: manager_exit_node
    class: ManagerExitNode
  - name: graceful_exit_control_node
    class: GracefulExitControlNode

tools:
  allowed_tools:
    # --- Top-level managers (switchboard delegates here) ---
    - emi_team_manager
    - personal_admin_manager
    - web_manager
    - devices_manager

    # --- Direct action tools the switchboard/orchestrator calls itself ---
    - one_shot_tool_runner
    - create_dayflow_ticket
    - work_emi_team_manager
    - run_task
    - find_tool
    - ask_user

    # --- Exotic system-control tools owned by dayflow orchestrator ---
    - set_ui_mute
    - set_screen_capture_enabled

    # --- KG context lookup ---
    - ask_kg
  except_tools: []

scope_contract:
  tools:
    allowed_tools: ["all"]
    blocked_tools:
      - install_tool
      - mcp::npm/playwright-mcp::browser_run_code
    requires_approval_tools: []

flow_config:
  strict_routing: true
  flow:
    normal:
      source_agent: "work_prep_node"
  state_map:
    # THE PLANNING TICK, and only that. A work node's time-wake used to enter here too, as a
    # routing hint (tick_router_node jumping to the state_mover) — a hint the router never saw,
    # so every wake ran this whole map. Wakes now open dayflow_wake_manager, which has no
    # planning stage to fall into (2026-09-18).
    # --- WORK-OBJECT planning path: the brain's list becomes work → architect (re)plans → state_mover
    #     promotes → materializer/switchboard pick ONE node. The dispatch gate claims it and
    #     opens dayflow_dispatch_manager on its own thread for the call and finalizer. ---
    # Until 2026-10-10 intake triage ran first (intake_triage_prep_node, the intake_triage agent, its spawn guard
    # and persist node), then the steward (strategic_planner_wo, its prep and persist nodes), which decided what work
    # exists from the intake triage admitted. Since 2026-10-06 the brain decides, through its list, and both were
    # skipped or found nothing; owner, 2026-10-10: "retire the old steward", "triage too". The steward's prep node is
    # now work_prep_node: pending concern and belief feedback, and the reminder history.
    "room::delegator": "work_prep_node"
    "work_prep_node": "brain_list_intake_node"
    # The finalizer runs in dayflow_dispatch_manager on the tool-return path, so a result
    # is judged in the dispatch pass that produced it. The architect therefore plans against nodes the finalizer has already
    # closed, instead of against last pass's unjudged results.
    # Work from the brain's list (control_nodes/brain_list_intake_node.py; 2026-10-05): shells for the entries the
    # brain decided needed, revisions and end instructions for changed ones. The architect then lays the new shells'
    # graphs like any new goal.
    "brain_list_intake_node": "work_architect_node"
    # work_repair_node was here, and is retired (2026-09-16; its files removed 2026-10-10). Its three dispositions
    # each belong to an agent that can see more than one failed step:
    #   retry    -> the finalizer's `retry`, which must NAME what will be different (an
    #               unchanged retry reproduces its error — 22 identical attempts in two hours)
    #   escalate -> the finalizer's `unrecoverable` + `ask_user`; the architect plans the ask.
    #               Repeated failure escalates to this deterministically (work_finalizer_node).
    #   abandon  -> `unrecoverable` + `stop` for a branch; the architect ends the goal.
    # A failure reached outside a dispatch (sweeper, claim error) sits `failed`; the finalizer judges the
    # sweeper's failed result, and a goal nothing can advance wakes the architect as stranded.
    "work_architect_node": "state_mover_prep_node"
    "state_mover_prep_node": "dayflow_orchestrator::state_mover"
    "dayflow_orchestrator::state_mover": "state_mover_persist_node"
    "state_mover_persist_node": "work_node_materializer_node"
    # relevance_cleaner was retired at the work-object cutover (its files removed 2026-10-10).
    "work_node_materializer_node": "dayflow_orchestrator::action_selector"
    "dayflow_orchestrator::action_selector": "action_selector_router_node"
    "action_selector_router_node": "dayflow_orchestrator::switchboard"
    # The dispatch gate CLAIMS the node and the planning pass ends. The call itself — the
    # arguments node, the tool caller, and the finalizer that judges what comes back — runs in
    # dayflow_dispatch_manager, one room per claimed node on its own thread.
    #
    # Those three stages lived here until 2026-09-17, which made the tick last as long as the
    # tool did. create_dayflow_ticket blocks for the whole ask window, and DayflowScheduler
    # admits one tick at a time while spacing the next from the previous tick's FINISH — so one
    # unanswered notify was an hour in which nothing planned, woke or dispatched. The tick now
    # ends at the claim, which is the state (not the elapsed time) that makes the graph stable
    # enough for the next instance to start.
    "dayflow_orchestrator::switchboard": "work_node_dispatch_node"
    "work_node_dispatch_node": "post_room_finalize_node"
    "post_room_finalize_node": "final_answer_node"
    "final_answer_node": "manager_exit_node"
    "graceful_exit": "graceful_exit_control_node"
    "graceful_exit_control_node": "final_answer_node"

# Permission scope for the kg_pipeline (KG ingest pipeline).
#
# PERMISSION ONLY. Identity (owner_id, actor_id, surface) is stamped per run by
# the caller via load_scope_for_source — never authored here.
#
# ONE scope per pipeline, built once at run start, threaded through every step.
#
# NO TOOLS: the kg_pipeline agents (entity_resolver, conversation_boundary,
# window_critic_v2, fact_extractor, meta_data_add) are toolless structured-output
# extractors — each declares allowed_tools: [] in its own config. They consume
# scope for RESOURCES + acting_as, never tools. The legacy builder emitted
# allowed_tools: [all] only because scope.json declared no tools block and the
# system default is permissive; this scope.yaml makes the real "no tools"
# posture explicit (fail-closed).
#
# write_kg is FALSE on purpose AND inert here: nothing in the kg_pipeline path
# reads scope.writes.write_kg. The extraction agents write proposal/extraction
# TABLES (kg_resolved_message, claim_proposals, ...); the proposal_promoter
# writes the LIVE KG via deterministic SQLAlchemy that takes no scope param.
# Both the extraction agents AND the promoter's LLM helpers (node_merger,
# ttl_estimator, fact_canonicalizer) are toolless and share THIS scope — the
# live-KG write is deterministic code, not a scope-gated capability, so no
# separate kg_promotion scope is needed.

approval:
  authority_level: 0

tools:
  allowed_tools: []

resources:
  allowed_global_resources: [all]
  resource_groups:
    - chat
    - memory

pods:
  allowed_scopes: [self]

writes:
  write_unified_log: true
  write_kg: false
  allow_fact_extraction: false

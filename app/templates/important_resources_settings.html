<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Resources</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/setup_wizard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .resource-editor-card {
            margin-bottom: 24px;
            padding: 16px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1f1f2c;
        }
        .resource-editor-card h3 {
            margin-top: 0;
        }
        .resource-editor-description {
            color: #aaa;
            margin: 6px 0 10px;
        }
        .resource-editor-path {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
        }
        .resource-editor-textarea {
            width: 100%;
            min-height: 220px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background: #12121a;
            color: #e8e8e8;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px;
            line-height: 1.35;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <h1>Important Resources</h1>
            <p>Edit high-impact instruction resources used in daily operations.</p>
            <a href="/chat_bot" class="back-link"><i class="fas fa-arrow-left"></i> Back to Chat</a>
        </div>

        <form id="importantResourcesForm">
            <div class="settings-section">
                <div id="resourceEditors"></div>
            </div>

            <div class="settings-actions">
                <button type="button" id="saveImportantResourcesBtn" class="btn-primary">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/important_resources_settings.js') }}"></script>
</body>
</html>

{# Quick settings dropdown — runtime toggles attached to the top-bar gear icon.

   IDs (menu-theme-toggle, menu-speak-mode, menu-quiet-mode) are canonical to
   menu_controls.js; do not change them.
#}
<li class="menu-item">
  <button id="menu-theme-toggle" class="menu-btn">
    <i class="fas fa-sun"></i>
    <span>Light/Dark Mode</span>
  </button>
</li>
<li class="menu-item">
  <button id="menu-speak-mode" class="menu-btn" aria-pressed="false">
    <i class="fas fa-microphone"></i>
    <span>Speak Mode: Off</span>
  </button>
</li>
<li class="menu-item">
  <button id="menu-quiet-mode" class="menu-btn" aria-pressed="false">
    <i class="fas fa-moon"></i>
    <span>Quiet Mode: Off</span>
  </button>
</li>

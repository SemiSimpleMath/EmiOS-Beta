<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ring Snapshots</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/setup_wizard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ring_snapshots.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <h1><i class="fas fa-images"></i> Ring Snapshots</h1>
            <p>Captured frames from your Ring cameras (newest first)</p>
            <a href="/settings/integrations/ring" class="back-link"><i class="fas fa-arrow-left"></i> Back to Ring Cameras</a>
        </div>

        <div class="ring-snapshots-toolbar">
            <button type="button" id="ring-snapshots-refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
            <span id="ring-snapshots-count" class="ring-snapshots-count"></span>
        </div>

        <div id="ring-snapshots-grid" class="ring-snapshots-grid"></div>
        <div id="ring-snapshots-empty" class="ring-snapshots-empty" style="display:none;">
            No snapshots yet. Capture one from the
            <a href="/settings/integrations/ring">Ring Cameras</a> page.
        </div>
        <div id="ring-snapshots-error" class="ring-snapshots-error" style="display:none;"></div>
    </div>

    <div id="ring-snapshots-lightbox" class="ring-snapshots-lightbox" style="display:none;">
        <span class="ring-snapshots-lightbox-close" id="ring-snapshots-lightbox-close">&times;</span>
        <img id="ring-snapshots-lightbox-img" alt="">
        <div id="ring-snapshots-lightbox-caption" class="ring-snapshots-lightbox-caption"></div>
    </div>

    <script src="{{ url_for('static', filename='js/ring_snapshots.js') }}"></script>
</body>
</html>

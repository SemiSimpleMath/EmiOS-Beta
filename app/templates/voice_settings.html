<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/setup_wizard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <h1>Voice Settings</h1>
            <p>Configure text-to-speech for your assistant</p>
            <a href="/settings/assistant" class="back-link"><i class="fas fa-arrow-left"></i> Back to Assistant Settings</a>
        </div>

        <form id="voiceSettingsForm">
            <div class="settings-section">
                <h2>Voice</h2>
                <p class="section-hint">Choose your preferred TTS provider and voice.</p>

                <div class="form-group">
                    <label for="tts_provider">TTS Provider</label>
                    <select id="tts_provider">
                        <option value="openai">OpenAI</option>
                        <option value="gemini">Google Gemini</option>
                    </select>
                </div>

                <!-- OpenAI voice options -->
                <div id="openai_voice_group">
                    <div class="form-group">
                        <label>OpenAI Voice</label>
                        <div class="voice-grid" id="openai_voice_grid">
                            <!-- populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Gemini voice options -->
                <div id="gemini_voice_group" style="display:none;">
                    <div class="form-group">
                        <label>Gemini Voice</label>
                        <div class="voice-grid" id="gemini_voice_grid">
                            <!-- populated by JS -->
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="gemini_tts_model">Gemini TTS Model</label>
                        <select id="gemini_tts_model">
                            <option value="gemini-2.5-flash-preview-tts">Gemini 2.5 Flash TTS (fast, recommended)</option>
                            <option value="gemini-2.5-pro-preview-tts">Gemini 2.5 Pro TTS (highest quality)</option>
                            <option value="gemini-2.5-flash-lite-preview-tts">Gemini 2.5 Flash Lite (fastest)</option>
                        </select>
                    </div>
                    <div id="gemini_api_key_warning" class="hint-box" style="display:none;">
                        <i class="fas fa-info-circle"></i>
                        Gemini API key not configured. Add <code>GOOGLE_API_KEY</code> on the <a href="/settings/api-keys">API Keys</a> page.
                    </div>
                </div>

                <!-- Sample player -->
                <div id="voice_sample_bar" style="display:none; margin-top:12px;">
                    <audio id="voice_sample_player" controls style="width:100%; margin-top:6px;"></audio>
                    <small id="voice_sample_status"></small>
                </div>
            </div>

            <div class="settings-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Save Voice Settings
                </button>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Saving...</p>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/voice_settings.js') }}"></script>
</body>
</html>

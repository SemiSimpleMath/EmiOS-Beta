<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Investigated findings — KG Maintenance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kg_maintenance.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kg_maintenance_investigated.css') }}">
</head>
<body>
  <header class="kgm-header">
    <h1>Investigated findings</h1>
    <p class="kgm-sub">
      Findings the investigator has diagnosed. Read the report, leave notes,
      then accept (close as resolved) or dismiss (won't apply).
      <a href="/kg-maintenance/">← back to dashboard</a>
    </p>
  </header>

  <main class="kgm-main">
    <div class="inv-toolbar">
      <select id="filter-type" onchange="loadFindings()">
        <option value="">All finding types</option>
        <option value="wiki_contradiction">wiki_contradiction</option>
        <option value="wiki_inferred_edge">wiki_inferred_edge</option>
        <option value="wiki_question">wiki_question</option>
        <option value="duplicate_node">duplicate_node</option>
        <option value="state_missing_dates">state_missing_dates</option>
      </select>
      <span id="inv-count" class="inv-count"></span>
    </div>

    <div id="inv-list" class="inv-list">
      <p class="inv-loading">Loading…</p>
    </div>
  </main>

  <script>
  (function () {
    const list = document.getElementById('inv-list');
    const countEl = document.getElementById('inv-count');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }
    function fmtDate(iso) {
      if (!iso) return '';
      try { return new Date(iso).toLocaleString(); } catch (_) { return iso; }
    }

    window.loadFindings = async function loadFindings() {
      const type = document.getElementById('filter-type').value;
      let url = '/kg-maintenance/api/investigated?limit=300';
      if (type) url += '&type=' + encodeURIComponent(type);
      list.innerHTML = '<p class="inv-loading">Loading…</p>';
      try {
        const res = await fetch(url);
        const data = await res.json();
        countEl.textContent = `${data.length} finding${data.length === 1 ? '' : 's'}`;
        if (!data.length) {
          list.innerHTML = '<p class="inv-empty">No investigated findings right now.</p>';
          return;
        }
        list.innerHTML = data.map(renderCard).join('');
      } catch (e) {
        list.innerHTML = `<p class="inv-error">Failed to load: ${esc(e.message)}</p>`;
      }
    };

    function renderCard(f) {
      const r = f.investigation_report_json || {};
      // New shape (post-2026-05-07): prose recommendation + disposition.
      // Old shape (proposed_action): rendered as fallback for legacy findings.
      const recommendation = r.recommendation || '';
      const disposition = (r.disposition || '').trim();
      const userQuestion = r.user_question || '';
      const confidenceFloat = typeof r.confidence === 'number' ? r.confidence : (r.proposed_action || {}).confidence;
      const confidence = confidenceFloat != null ? (confidenceFloat * 100).toFixed(0) + '%' : '';
      const operatorNotes = r.operator_notes || '';
      const evidenceList = Array.isArray(r.evidence) ? r.evidence : [];
      const openQuestions = Array.isArray(r.open_questions) ? r.open_questions : [];
      const primaryLabel = (f.primary_node && f.primary_node.label) || f.primary_node_id || '(no node)';
      const primaryNodeId = (f.primary_node && f.primary_node.id) || f.primary_node_id || '';
      const nodeLink = primaryNodeId ? `<a href="/kg/node/${esc(primaryNodeId)}" target="_blank">${esc(primaryLabel)}</a>` : esc(primaryLabel);

      const evidenceHtml = evidenceList.length
        ? `<details class="inv-collapsible"><summary>Evidence (${evidenceList.length})</summary><pre class="inv-json">${esc(JSON.stringify(evidenceList, null, 2))}</pre></details>`
        : '';

      const questionsHtml = openQuestions.length
        ? `<div class="inv-questions"><h4>Other open questions</h4><ul>${openQuestions.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>`
        : '';

      const dispositionBadge = disposition === 'needs_user_review'
        ? '<span class="inv-disposition inv-disposition-user">needs your review</span>'
        : disposition === 'auto_apply'
          ? '<span class="inv-disposition inv-disposition-auto">auto-apply (24h grace)</span>'
          : '';

      // Grace timer for auto_apply: countdown from investigated_at + 24h
      let graceHtml = '';
      if (disposition === 'auto_apply' && f.investigated_at) {
        const inv = new Date(f.investigated_at).getTime();
        const expires = inv + 24 * 60 * 60 * 1000;
        const remaining = Math.max(0, expires - Date.now());
        const hours = Math.floor(remaining / 3_600_000);
        const minutes = Math.floor((remaining % 3_600_000) / 60_000);
        graceHtml = remaining > 0
          ? `<div class="inv-grace">⏳ Auto-applies in ${hours}h ${minutes}m unless you accept / decline.</div>`
          : '<div class="inv-grace inv-grace-expired">⏰ Grace expired — pending next executor cron.</div>';
      }

      const userQHtml = userQuestion
        ? `<div class="inv-user-question"><h4>Question for you</h4><p class="inv-prose">${esc(userQuestion)}</p></div>`
        : '';

      // Legacy fallback: render the old proposed_action if no recommendation exists.
      const legacyProposed = (!recommendation && r.proposed_action)
        ? `<div class="inv-proposed inv-legacy">
             <h4>Proposed action (legacy schema): <code>${esc(r.proposed_action.op || '?')}</code></h4>
             ${r.proposed_action.args ? `<div class="inv-prose">${esc(r.proposed_action.args)}</div>` : ''}
           </div>`
        : '';

      return `
        <article class="inv-card" id="card-${esc(f.id)}" data-disposition="${esc(disposition)}">
          <header class="inv-card-head">
            <div class="inv-card-head-left">
              <span class="inv-type-badge inv-type-${esc(f.finding_type)}">${esc(f.finding_type.replace(/_/g, ' '))}</span>
              <span class="inv-priority inv-priority-${esc(f.priority)}">${esc(f.priority)}</span>
              ${dispositionBadge}
              ${confidence ? `<span class="inv-confidence">conf ${confidence}</span>` : ''}
            </div>
            <div class="inv-card-head-right">
              <span class="inv-meta">${nodeLink}</span>
              <span class="inv-meta-time">${esc(fmtDate(f.investigated_at))}</span>
            </div>
          </header>

          ${graceHtml}
          ${userQHtml}

          ${recommendation || r.proposed_action ? `
          <div class="inv-recommendation">
            <h4>Recommendation <span class="inv-rec-hint">(edit to refine; autosaves on blur — this is what the executor will run)</span></h4>
            <textarea id="rec-${esc(f.id)}" rows="6" class="inv-rec-textarea"
                      onblur="saveRecommendation('${esc(f.id)}')"
                      placeholder="What should happen and why...">${esc(recommendation)}</textarea>
            <span class="inv-save-status" id="save-status-${esc(f.id)}"></span>
          </div>

          <div class="inv-notes-block">
            <h4>Your notes <span class="inv-rec-hint">(private context — not seen by the executor; autosaves on blur)</span></h4>
            <textarea id="notes-${esc(f.id)}" rows="3" class="inv-notes-textarea"
                      onblur="saveNotes('${esc(f.id)}')"
                      placeholder="Your thoughts about this finding — won't be sent to the executor.">${esc(operatorNotes)}</textarea>
            <span class="inv-save-status" id="notes-save-status-${esc(f.id)}"></span>
          </div>` : ''}

          ${legacyProposed}

          ${r.diagnosis ? `<details class="inv-collapsible"><summary>Diagnosis</summary><div class="inv-prose">${esc(r.diagnosis)}</div></details>` : ''}
          ${evidenceHtml}
          ${questionsHtml}

          ${r.final_answer_answer ? `<details class="inv-collapsible"><summary>Full final answer</summary><div class="inv-prose">${esc(r.final_answer_answer)}</div></details>` : ''}

          <div class="inv-original">
            <h4>Original critic finding</h4>
            <p class="inv-prose">${esc(f.reason || '(no reason recorded)')}</p>
          </div>

          <div class="inv-actions">
            <button type="button" class="inv-btn inv-btn-accept" onclick="acceptFinding('${esc(f.id)}')"
                    title="Run the recommendation now via kg_resolution_manager — bypasses the 24h grace.">
              ✓ Accept (run now)
            </button>
            <button type="button" class="inv-btn inv-btn-dismiss" onclick="dismissFinding('${esc(f.id)}')"
                    title="Mark as dismissed — no execution.">
              ✗ Decline
            </button>
          </div>
        </article>
      `;
    }

    function recommendationValue(id) {
      const ta = document.getElementById('rec-' + id);
      return ta ? ta.value : '';
    }
    function flashStatus(id, msg, isError) {
      const el = document.getElementById('save-status-' + id);
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('is-error', !!isError);
      setTimeout(() => { el.textContent = ''; el.classList.remove('is-error'); }, 3500);
    }

    // Autosave on blur — the dev edits the recommendation prose, clicks
    // away, change persists. The 24h grace timer keeps counting; the
    // edited prose is what the executor will run on grace expiry (or
    // immediate run via Accept).
    window.saveRecommendation = async function saveRecommendation(id) {
      const recommendation = recommendationValue(id);
      try {
        const res = await fetch(`/kg-maintenance/api/finding/${id}/recommendation`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recommendation }),
        });
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        flashStatus(id, 'Saved.', false);
      } catch (e) {
        flashStatus(id, 'Save failed: ' + e.message, true);
      }
    };

    // Notes: separate from recommendation — your private context. Stored
    // on investigation_report_json.operator_notes; not consumed by the
    // executor. Useful for "I'm watching this one" or "discussed with X
    // on Y date — apply only after Z."
    function notesValue(id) {
      const ta = document.getElementById('notes-' + id);
      return ta ? ta.value : '';
    }
    function flashNotesStatus(id, msg, isError) {
      const el = document.getElementById('notes-save-status-' + id);
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('is-error', !!isError);
      setTimeout(() => { el.textContent = ''; el.classList.remove('is-error'); }, 3500);
    }
    window.saveNotes = async function saveNotes(id) {
      const notes = notesValue(id);
      try {
        const res = await fetch(`/kg-maintenance/api/finding/${id}/operator_notes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes }),
        });
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        flashNotesStatus(id, 'Notes saved.', false);
      } catch (e) {
        flashNotesStatus(id, 'Save failed: ' + e.message, true);
      }
    };

    // Accept = run via kg_resolution_manager NOW (bypasses the 24h grace).
    // The current saved recommendation prose is what gets executed.
    window.acceptFinding = async function acceptFinding(id) {
      const card = document.getElementById('card-' + id);
      if (!confirm('Run this recommendation now via kg_resolution_manager?\n\nThis applies the (possibly edited) prose to the KG. Reversible only via kg_revision_log.')) return;
      const actions = card?.querySelector('.inv-actions');
      const prevHtml = actions?.innerHTML;
      if (actions) actions.innerHTML = '<span class="inv-applying">⚡ Running… (10-90s)</span>';
      try {
        const res = await fetch(`/kg-maintenance/api/finding/${id}/accept`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        card.classList.add('is-closed');
        const summary = data.result_summary || data.outcome?.result_summary || '(no summary)';
        const term = data.terminal_status || data.outcome?.outcome || 'ran';
        if (actions) {
          actions.innerHTML = `
            <div class="inv-applied-block">
              <span class="inv-closed-badge inv-closed-applied">${esc(term)}</span>
              <p class="inv-applied-summary">${esc(summary)}</p>
            </div>`;
        }
      } catch (e) {
        if (actions) actions.innerHTML = prevHtml || '';
        alert('Accept failed: ' + e.message);
      }
    };

    // Decline = mark dismissed; no execution.
    window.dismissFinding = async function dismissFinding(id) {
      if (!confirm('Decline this finding?\n\nNo KG changes will be made; the finding is closed as dismissed.')) return;
      try {
        const res = await fetch(`/kg-maintenance/api/finding/${id}/dismiss`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        const card = document.getElementById('card-' + id);
        if (card) {
          card.classList.add('is-closed');
          card.querySelector('.inv-actions').innerHTML = '<span class="inv-closed-badge">Dismissed</span>';
        }
      } catch (e) {
        alert('Decline failed: ' + e.message);
      }
    };

    document.addEventListener('DOMContentLoaded', loadFindings);
  })();
  </script>
</body>
</html>

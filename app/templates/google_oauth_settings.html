<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google OAuth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/setup_wizard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <h1><i class="fab fa-google"></i> Google OAuth</h1>
            <p>Connect your primary Google account for Gmail, Calendar, and Tasks</p>
            <a href="/settings/integrations" class="back-link"><i class="fas fa-arrow-left"></i> Back to Integrations</a>
        </div>

        <div class="settings-section">
            <h2><i class="fas fa-user"></i> Primary Account</h2>
            <div id="google-oauth-primary-account"></div>
        </div>

        <div class="settings-section">
            <h2><i class="fas fa-route"></i> Service Routing</h2>
            <p class="step-description">Which Google account should each service use?</p>
            <div class="feature-grid" id="google-oauth-service-grid"></div>
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>
    </div>

    <script src="{{ url_for('static', filename='js/integrations_shared.js') }}"></script>
    <script src="{{ url_for('static', filename='js/google_oauth_settings.js') }}"></script>
</body>
</html>
